<style>
/* ОСНОВНА (варіант A «Реквізити») — світла сторінка: заголовок, дві картки з реквізитами, бірюзова картка з QR */
.pg{display:grid;justify-items:center;gap:80px;padding-block:150px 120px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{width:var(--row);max-width:100%;min-width:0;box-sizing:border-box}
.top{display:grid;justify-items:center;gap:24px;text-align:center}
.top h1{font-weight:500;font-size:clamp(48px,7.5vw,120px);line-height:.98;letter-spacing:-.055em}
.top .lead{max-width:680px;font:var(--h3-weight) var(--h3-size)/var(--h3-lh) var(--font);letter-spacing:var(--h3-track);color:var(--soft);text-wrap:balance}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:8px}

.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:start}
.cards{grid-column:1/4;display:grid;gap:14px}
.acc{padding:clamp(24px,3vw,40px);border-radius:20px;background:var(--card);display:grid;gap:8px}
.acc-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-bottom:18px}
.acc-h h2{font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track)}
.acc-h span{font:var(--t3-weight) var(--t3-size)/var(--t3-lh) var(--font);letter-spacing:var(--t3-track);color:var(--teal)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) 136px;align-items:center;gap:6px 20px;padding:16px 0;border-top:1px solid var(--line)}
.row dt{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}
.row dd{margin:0;font:var(--h3-weight) var(--h3-size)/var(--h3-lh) var(--font);letter-spacing:var(--h3-track);overflow-wrap:anywhere}
.row dd.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.qrc{grid-column:4/5;position:sticky;top:110px;display:grid;gap:18px;padding:14px;border-radius:20px;background:var(--teal);color:var(--ds-cream)}
.qrc .qr{transition:scale .4s cubic-bezier(.2,.7,.2,1)}
.qrc .qr:hover{scale:1.02}
.qrc .qr:focus-visible{outline:3px solid var(--ds-cream);outline-offset:3px}
.qrc .kicker{color:rgba(247,242,232,.75);padding:6px 6px 0}
.qrc p:last-child{padding:0 6px 6px;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:rgba(247,242,232,.85)}

@media (max-width:1000px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .cards,.qrc{grid-column:1/-1}
  .qrc{position:static}
}
@media (max-width:720px){
  .pg{gap:48px;padding-block:120px 72px}
  .acc,.qr,.qrc{border-radius:16px}
  .row{grid-template-columns:minmax(0,1fr) auto}.row dt{grid-column:1/-1}
  .acts{width:100%}.acts>*{flex:1 1 100%}
}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"></main>
<site-footer></site-footer>
<script src="/donate/data.js"></script>
<script src="/donate/base.js"></script>
<script>
(()=>{
const D=window.DONATE,{esc,copyBtn}=DN;
document.getElementById("app").innerHTML=`
  <header class="top">
    <p class="kicker rv">${esc(D.kicker)}</p>
    <h1 class="rv" style="--d:1">${esc(D.title)}</h1>
    <p class="lead rv" style="--d:2">${esc(D.lead)}</p>
    <div class="acts rv" style="--d:3"><a class="lbtn" href="${esc(D.online.href)}" target="_blank" rel="noopener">${esc(D.online.label)}</a></div>
  </header>
  <div class="grid">
    <div class="cards">${D.accounts.map((a,i)=>`
      <section class="acc rv" style="--d:${i}" aria-labelledby="h-${a.id}">
        <div class="acc-h"><h2 id="h-${a.id}">${esc(a.title)}</h2><span>${esc(a.tab)}</span></div>
        <dl style="margin:0">${a.rows.map(r=>`<div class="row"><dt>${esc(r.k)}</dt><dd${r.mono?' class="mono"':""}>${esc(r.v)}</dd>${r.copy?copyBtn(r.v,r.k):""}</div>`).join("")}</dl>
      </section>`).join("")}
    </div>
    <aside class="qrc rv" style="--d:2" aria-label="QR-код для оплати">
      <p class="kicker">Оплата за QR</p>
      <a class="qr" href="${esc(D.online.href)}" target="_blank" rel="noopener" aria-label="${esc(D.online.label)}: ${esc(D.qr.alt)}"><img src="${esc(D.qr.src)}" alt="" width="557" height="557"></a>
      <p>${esc(D.qr.caption)}</p>
    </aside>
  </div>`;
DN.init({switcher:false});
})();
</script>
</body>
