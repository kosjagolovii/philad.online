<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Контакти</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<script src="components/map.js"></script>
<link rel="stylesheet" href="contacts/base.css">
<style>
.pg{display:grid;justify-items:center;gap:90px;padding-block:150px 90px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{min-width:0;box-sizing:border-box}
.pg>.row-w,.pg>.fv-map{width:var(--row);max-width:100%}
@media (max-width:720px){.pg{gap:56px;padding-block:120px 56px}}
/* ВАРІАНТ B · «Карта першою» — після вступу одразу карта, під нею три плитки з контактами та велика форма */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.tile{display:grid;align-content:space-between;gap:48px;min-height:240px;padding:28px 26px;border-radius:20px;background:var(--card)}
.tile h2{margin:0;font-weight:600;font-size:14px;letter-spacing:-.02em;color:var(--mute)}
.tile .v{margin:0;font-weight:500;font-size:clamp(24px,2.3vw,34px);line-height:1.15;letter-spacing:-.04em}
.tile .v small{display:block;margin-top:8px;font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--mute)}
.tile.t-time{background:var(--ink);color:var(--ds-cream)}
.tile.t-time h2{color:rgba(247,242,232,.6)}
.tile.t-time .v{display:grid;gap:6px}
.tile.t-time .v b{font-weight:500}
.tile.t-time .v span{color:rgba(247,242,232,.6)}
.formb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;padding:clamp(28px,4vw,64px);border-radius:24px;background:var(--card);align-items:start}
.formb h2{margin:0;font-weight:500;font-size:clamp(34px,4.2vw,64px);line-height:1.02;letter-spacing:-.05em}
.formb p.t{margin:18px 0 0;max-width:420px;font-weight:600;font-size:17px;line-height:1.4;letter-spacing:-.02em;color:var(--mute)}
@media (max-width:1000px){.tiles{grid-template-columns:minmax(0,1fr)}.tile{min-height:0;gap:28px}.formb{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.tile,.formb{border-radius:16px}.formb{padding:28px 20px}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"></main>
<site-footer></site-footer>
<script src="contacts/base.js"></script>
<script>
(()=>{
const {esc,S,days,MAIL,addr,formHTML}=CT;
document.getElementById("app").innerHTML=`
  <section class="intro" aria-labelledby="h">
    <p class="kick rv">Контакти</p>
    <h1 id="h" class="rv" style="--d:1">Зв’яжіться з нами</h1>
    <p class="lead rv" style="--d:2">Напишіть нам, залиште заявку або приходьте на недільне служіння — ми раді кожному.</p>
    <a class="go rv" style="--d:3" href="#map" data-goto="#map">Як добратись?</a>
  </section>
  <church-map></church-map>
  <section class="tiles row-w" aria-label="Контакти">
    <div class="tile rv"><h2>Пошта</h2><p class="v"><a class="big-link" href="mailto:${esc(MAIL)}" data-no-u>${esc(MAIL)}</a></p></div>
    <div class="tile rv" style="--d:1"><h2>Адреса</h2><p class="v">${esc(addr)}<small>Поряд зі станцією метро «Голосіївська»</small></p></div>
    <div class="tile t-time rv" style="--d:2" data-dark><h2>Час основних зібрань</h2><p class="v">${days.map(d=>`<span><b>${esc(d.time)}</b> ${esc(d.day)}</span>`).join("")}</p></div>
  </section>
  <section class="formb row-w rv" aria-label="Форма заявки">
    <div><h2>Залишити заявку</h2><p class="t">Розкажіть, чим ми можемо допомогти, — і ми зв’яжемось з вами.</p></div>
    ${formHTML()}
  </section>`;
CT.init();
})();
</script>
</body>
</html>
