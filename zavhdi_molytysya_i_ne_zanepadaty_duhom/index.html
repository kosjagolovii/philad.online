<style>
.pg{display:grid;justify-items:center;padding-block:130px 90px;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>.row-w{min-width:0}
.hold{position:relative;z-index:1;background:var(--ds-cream)}   /* контент їде вгору й відкриває закріплений футер */
.lead{margin:0;max-width:520px;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.03em;color:var(--mute)}
.guestbtn{width:100%;justify-content:space-between;min-height:48px;background:var(--teal);border-color:var(--teal);color:var(--ds-cream);font-weight:700}
.guestbtn em{color:rgba(247,242,232,.75)}
.guestbtn:hover{border-color:var(--teal-ink);background:var(--teal-ink)}
.guestbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
@media (max-width:720px){.pg{padding-block:112px 64px}}
/* ВАРІАНТ A · «Бічна панель» — зліва закріплені фільтри за групами міток, справа сітка тем */
.top{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px 40px;margin-bottom:40px}
.lay{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:14px;align-items:start}
/* зверху лишаємо місце під логотип: шапка з'являється при прокручуванні вгору й не має накривати пошук */
.side{--top:104px;grid-column:1/2;position:sticky;top:var(--top);display:grid;gap:16px;max-height:calc(100svh - var(--top) - 24px);overflow:auto;padding:2px 14px 20px 2px;scrollbar-width:thin}
.fg{border-top:1px solid var(--line);padding-top:16px}
.fg summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;font-weight:700;font-size:15px;letter-spacing:-.02em}
.fg summary::-webkit-details-marker{display:none}
.fg summary::after{content:"";width:10px;height:10px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -2px;transition:rotate .3s ease}
.fg[open] summary::after{rotate:225deg;translate:0 2px}
.fg summary:focus-visible{outline:2px solid var(--teal);outline-offset:4px;border-radius:4px}
.fl{display:flex;flex-wrap:wrap;gap:6px;padding-top:14px}
.fl .chip{min-height:34px;padding:0 12px;font-size:14px}
.sub{padding-top:14px;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.res{grid-column:2/5;display:grid;gap:22px;min-width:0}
.rh{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.rinfo{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.act{display:flex;flex-wrap:wrap;gap:6px}
.act .chip{min-height:34px;padding:0 6px 0 14px;background:var(--teal);border-color:var(--teal);color:var(--ds-cream);font-size:14px}
.act .chip::after{content:"×";font-size:18px;line-height:1;width:22px;text-align:center;opacity:.8}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fbtn{display:none}
@media (max-width:1000px){
  .lay{grid-template-columns:minmax(0,1fr)}
  .side,.res{grid-column:1/-1}
  .side{position:static;max-height:none;overflow:visible;padding:0;display:none}
  .side.open{display:grid;margin-bottom:24px}
  .fbtn{display:inline-flex}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){.grid3{grid-template-columns:minmax(0,1fr)}.rh{grid-template-columns:minmax(0,1fr)}}

/* ОСНОВНА (варіант D) · як A, але картки в стилі сторінки «Проповіді»: без темної підкладки, фото 16:9 із заокругленням, текст просто на фоні сторінки */
.tc{background:none;border-radius:0;overflow:visible;gap:16px;align-content:start}
.tc:hover{background:none;translate:none}
.tc-img{aspect-ratio:16/9;border-radius:18px;background:var(--sand)}
.tc-b{padding:0;gap:10px}
.tc-meta{font-size:13px}
.tc h3{font-size:clamp(20px,1.7vw,25px);line-height:1.15;letter-spacing:-.035em}
.tc-ex{font-size:15px}
.grid3{gap:36px 14px}
@media (max-width:720px){.tc{border-radius:0}.tc-img{border-radius:14px}.tc-b{padding:0}.grid3{gap:28px}}

<site-menu tone="auto"></site-menu>
<div class="end">
  <div class="hold"><main class="pg" id="app"><div class="row-w"><p class="kick">Завантаження…</p></div></main></div>
  <site-footer></site-footer>
</div>
<script src="hgthemes/base.js"></script>
<script>
(async()=>{
const HG=window.HG,{esc}=HG;
await HG.load();
const chip=(g,f)=>`<button class="chip${f.count?"":" zero"}" type="button" aria-pressed="${f.active}" data-toggle="${g}:${esc(f.value)}"><span>${esc(f.label)}</span><em>${f.count}</em></button>`;
const guestBtn=()=>{const n=HG.guestsCount();return `<button class="chip guestbtn${n||HG.state.guests?"":" zero"}" type="button" aria-pressed="${HG.state.guests}" data-toggle="guests:1"><span>Для невоцерковлених гостей</span><em>${n}</em></button>`};
const NAMES={ot:"Старий Заповіт",nt:"Новий Заповіт"};
const app=document.getElementById("app");
app.innerHTML=`<div class="row-w">
  <header class="top"><h1 class="sm-h1">Теми домашніх груп</h1><p class="lead" id="lead"></p></header>
  <div class="lay">
    <aside class="side" id="side" aria-label="Фільтри">
      <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Назва чи слово з теми" autocomplete="off"></label>
      ${HG.data.groups.map(g=>`<details class="fg" open><summary>${esc(g.label)}</summary><div class="fl" data-grp="${g.id}"></div></details>`).join("")}
      <details class="fg"><summary>Книга Біблії</summary><div data-facet="book"></div></details>
      <details class="fg"><summary>Рік</summary><div class="fl" data-facet="year"></div></details>
      <details class="fg"><summary>Мова</summary><div class="fl" data-facet="lang"></div></details>
    </aside>
    <section class="res" aria-live="polite">
      <div class="rh"><div class="rinfo"><button class="chip fbtn" id="fbtn" type="button">Фільтри</button><span id="count"></span><button class="reset" data-reset id="reset" type="button" hidden>Скинути все</button></div>
        <select class="sel" id="sort" aria-label="Сортування"><option value="new">Спочатку нові</option><option value="old">Спочатку старі</option><option value="az">За алфавітом</option><option value="q">Більше питань</option></select></div>
      <div class="act" id="act"></div>
      <div class="grid3" id="grid"></div>
      <div class="loading" id="load" hidden><i></i></div>
      <div class="sentinel" id="sent"></div>
    </section>
  </div></div>`;
const q=document.getElementById("q"),sort=document.getElementById("sort");
q.value=HG.state.q;sort.value=HG.state.sort;
q.addEventListener("input",()=>HG.setQ(q.value));
sort.addEventListener("change",()=>HG.setSort(sort.value));
document.getElementById("fbtn").addEventListener("click",()=>document.getElementById("side").classList.toggle("open"));
const grid=document.getElementById("grid"),sent=document.getElementById("sent"),load=document.getElementById("load");
let cur=[],shown=0;
/* картки підвантажуються самі, коли прокручуєш до кінця списку */
function fill(){
  const next=cur.slice(shown,shown+HG.STEP);if(!next.length)return;
  grid.insertAdjacentHTML("beforeend",next.map(i=>HG.card(i)).join(""));shown+=next.length;
  load.hidden=shown>=cur.length;
}
let busy=false;
function check(){
  if(busy||shown>=cur.length||sent.getBoundingClientRect().top>=innerHeight+900)return;
  busy=true;fill();setTimeout(()=>{busy=false;check()},60);
}
new IntersectionObserver(es=>{if(es[0].isIntersecting)check()},{rootMargin:"900px 0px"}).observe(sent);
addEventListener("scroll",check,{passive:true});addEventListener("resize",check);   // страхуємо спостерігач: перевірка і при кожному прокручуванні
function render(){
  const tags=HG.facets("tag");
  HG.data.groups.forEach(g=>{document.querySelector(`[data-grp="${g.id}"]`).innerHTML=tags.filter(f=>f.group===g.id).map(f=>chip("tag",f)).join("")});
  const bk=HG.facets("book");
  document.querySelector('[data-facet="book"]').innerHTML=["ot","nt"].map(t=>`<div class="sub">${NAMES[t]}</div><div class="fl">${bk.filter(f=>f.testament===t).map(f=>chip("book",f)).join("")}</div>`).join("");
  document.querySelector('[data-facet="year"]').innerHTML=HG.facets("year").map(f=>chip("year",f)).join("");
  document.querySelector('[data-facet="lang"]').innerHTML=HG.facets("lang").map(f=>chip("lang",f)).join("");
  const list=HG.filtered(),n=list.length;
  document.getElementById("count").textContent=`${n} ${HG.plural(n)}`;
  document.getElementById("lead").textContent="Шукайте по назві, за типом, міткою, біблійною книгою, роком чи мовою";
  document.getElementById("reset").hidden=!HG.activeCount();
  document.getElementById("act").innerHTML=HG.activeList().map(a=>`<button class="chip" type="button" data-toggle="${a.group}:${esc(a.value)}" aria-label="Зняти: ${esc(a.label)}">${esc(a.label)}</button>`).join("");
  cur=list;shown=0;grid.innerHTML="";
  if(!n)grid.innerHTML=`<div class="empty" style="grid-column:1/-1"><b>Нічого не знайдено</b><span>Спробуйте прибрати частину фільтрів</span><button class="reset" data-reset type="button">Скинути все</button></div>`;
  else{fill();check()}
  if(document.activeElement!==q&&q.value!==HG.state.q)q.value=HG.state.q;
}
HG.onChange(render);render();
HG.init();
})();
</script>
</body>
