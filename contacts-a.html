<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Контакти</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<script src="components/map.js"></script>
<link rel="stylesheet" href="contacts/base.css">
<style>
.pg{display:grid;justify-items:center;gap:90px;padding-block:150px 90px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{min-width:0;box-sizing:border-box}
.pg>.row-w,.pg>.fv-map{width:var(--row);max-width:100%}
@media (max-width:720px){.pg{gap:56px;padding-block:120px 56px}}
/* ВАРІАНТ A · «Дві колонки» — зліва картка з контактами й розкладом, справа бірюзова форма; карта знизу */
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px;align-items:stretch}
.info{display:grid;align-content:space-between;gap:36px;padding:clamp(28px,3.4vw,52px);border-radius:20px;background:var(--card)}
.blk{display:grid;gap:8px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.blk:last-child{border-bottom:0;padding-bottom:0}
.blk h2{margin:0;font-weight:600;font-size:14px;letter-spacing:-.02em;color:var(--mute)}
.blk .v{font-weight:500;font-size:clamp(24px,2.6vw,38px);line-height:1.15;letter-spacing:-.04em}
.blk .v small{display:block;margin-top:6px;font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--mute)}
.times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.times div{display:grid;gap:2px}
.times b{font-weight:500;font-size:clamp(34px,3.6vw,54px);line-height:1;letter-spacing:-.05em;color:var(--teal-ink)}
.times span{font-weight:600;font-size:15px;color:var(--mute)}
.formc{display:grid;align-content:start;gap:22px;padding:clamp(28px,3.4vw,52px);border-radius:20px;background:var(--teal);color:var(--ds-cream)}
.formc h2{margin:0;font-weight:500;font-size:clamp(28px,3vw,44px);line-height:1.1;letter-spacing:-.045em}
@media (max-width:1000px){.duo{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.duo{gap:12px}.info,.formc{border-radius:16px;padding:28px 20px}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"></main>
<site-footer></site-footer>
<script src="contacts/base.js"></script>
<script>
(()=>{
const {esc,S,days,MAIL,addr,formHTML}=CT;
document.getElementById("app").innerHTML=`
  <section class="intro" aria-labelledby="h">
    <p class="kick rv">Контакти</p>
    <h1 id="h" class="rv" style="--d:1">Зв’яжіться з нами</h1>
    <p class="lead rv" style="--d:2">Напишіть нам, залиште заявку або приходьте на недільне служіння — ми раді кожному.</p>
    <a class="go rv" style="--d:3" href="#map" data-goto="#map">Як добратись?</a>
  </section>
  <section class="duo row-w" aria-label="Контакти та форма">
    <div class="info rv">
      <div class="blk"><h2>Пошта</h2><p class="v"><a class="big-link" href="mailto:${esc(MAIL)}" data-no-u>${esc(MAIL)}</a></p></div>
      <div class="blk"><h2>Адреса</h2><p class="v">${esc(addr)}<small>Поряд зі станцією метро «Голосіївська»</small></p></div>
      <div class="blk"><h2>Час основних зібрань</h2><div class="times">${days.map(d=>`<div><b>${esc(d.time)}</b><span>${esc(d.day)}</span></div>`).join("")}</div></div>
    </div>
    <div class="formc rv" style="--d:1"><h2>Залишити заявку</h2>${formHTML({dark:true})}</div>
  </section>
  <church-map></church-map>`;
CT.init();
})();
</script>
</body>
</html>
