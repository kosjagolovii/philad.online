<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пожертви</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="donate/base.css">
<style>
/* ВАРІАНТ C · «Вкладки» — зліва закріплена колонка із заголовком і QR, справа перемикач UAH / USD та реквізити */
.pg{padding-block:150px 120px;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.lay{width:var(--row);max-width:100%;margin-inline:auto;box-sizing:border-box;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:14px;align-items:start}
.side{grid-column:1/3;position:sticky;top:110px;display:grid;gap:28px;padding-right:clamp(0px,3vw,48px)}
.side h1{font-weight:500;font-size:clamp(46px,6.2vw,100px);line-height:.96;letter-spacing:-.055em}
.side .lead{font-weight:500;font-size:clamp(17px,1.5vw,21px);line-height:1.4;letter-spacing:-.025em;color:var(--soft);text-wrap:pretty}
.side-q{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:18px;align-items:center;padding:12px;border-radius:20px;background:var(--card)}
.side-q .qr{border-radius:14px;padding:10px}
.side-q p{font-weight:600;font-size:14px;line-height:1.35;letter-spacing:-.01em;color:var(--soft)}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn2{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 33px;border-radius:12px;background:rgba(20,20,20,.07);color:var(--ink);text-decoration:none;
  font:800 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;transition:scale .35s cubic-bezier(.2,.7,.2,1),background .25s ease}
.btn2:hover{scale:1.04;background:rgba(20,20,20,.12)}
.btn2:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

.main{grid-column:3/5;display:grid;gap:22px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:6px;border-radius:999px;background:var(--card)}
.tab{height:52px;border:0;border-radius:999px;background:none;color:var(--soft);font:700 15px/1 var(--sans);letter-spacing:-.01em;cursor:pointer;transition:background .3s ease,color .3s ease}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--ds-cream)}
.tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.panel h2{font-weight:500;font-size:clamp(26px,2.8vw,40px);line-height:1.1;letter-spacing:-.04em;padding:14px 4px 18px}
.panel:not([hidden]){animation:show .55s cubic-bezier(.2,.7,.2,1)}
@keyframes show{from{opacity:0;translate:0 10px}}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:18px 4px;border-top:1px solid var(--line)}
.panel .row:last-child{border-bottom:1px solid var(--line)}
.row dt{grid-column:1/-1;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--mute)}
.row dd{margin:0;font-weight:500;font-size:clamp(18px,1.7vw,24px);line-height:1.3;letter-spacing:-.03em;overflow-wrap:anywhere}
.row dd.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}

@media (max-width:1000px){
  .lay{grid-template-columns:minmax(0,1fr);row-gap:40px}
  .side,.main{grid-column:1/-1}.side{position:static;padding:0}
}
@media (max-width:720px){
  .pg{padding-block:120px 72px}
  .side-q{grid-template-columns:minmax(0,120px) minmax(0,1fr)}
  .side-q,.side-q .qr{border-radius:16px}
  .acts>*{flex:1 1 100%}
}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"></main>
<site-footer></site-footer>
<script src="donate/data.js"></script>
<script src="donate/base.js"></script>
<script>
(()=>{
const D=window.DONATE,{esc,copyBtn}=DN;
document.getElementById("app").innerHTML=`
  <div class="lay">
    <aside class="side">
      <p class="kicker rv">${esc(D.kicker)}</p>
      <h1 class="rv" style="--d:1">${esc(D.title)}</h1>
      <p class="lead rv" style="--d:2">${esc(D.lead)}</p>
      <div class="side-q rv" style="--d:2"><div class="qr"><img src="${esc(D.qr.src)}" alt="${esc(D.qr.alt)}" width="557" height="557"></div><p>${esc(D.qr.caption)}</p></div>
      <div class="acts rv" style="--d:3"><a class="lbtn" href="${esc(D.online.href)}" target="_blank" rel="noopener">${esc(D.online.label)}</a><a class="btn2" href="${esc(D.mono.href)}" target="_blank" rel="noopener">${esc(D.mono.label)}</a></div>
    </aside>
    <div class="main rv" style="--d:1">
      <div class="tabs" role="tablist" aria-label="Валюта рахунку">${D.accounts.map((a,i)=>`<button class="tab" role="tab" id="tab-${a.id}" aria-controls="p-${a.id}" aria-selected="${!i}" tabindex="${i?-1:0}">${esc(a.tab)}</button>`).join("")}</div>
      ${D.accounts.map((a,i)=>`
      <section class="panel" role="tabpanel" id="p-${a.id}" aria-labelledby="tab-${a.id}"${i?" hidden":""}>
        <h2>${esc(a.title)}</h2>
        <dl style="margin:0">${a.rows.map(r=>`<div class="row"><dt>${esc(r.k)}</dt><dd${r.mono?' class="mono"':""}>${esc(r.v)}</dd>${r.copy?copyBtn(r.v,r.k):""}</div>`).join("")}</dl>
      </section>`).join("")}
    </div>
  </div>`;
DN.init();
const tabs=[...document.querySelectorAll(".tab")],panels=[...document.querySelectorAll(".panel")];
const pick=(n,f)=>{tabs.forEach((t,i)=>{t.setAttribute("aria-selected",i===n);t.tabIndex=i===n?0:-1;panels[i].hidden=i!==n});if(f)tabs[n].focus()};
tabs.forEach((t,i)=>{t.addEventListener("click",()=>pick(i));t.addEventListener("keydown",e=>{const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(d){e.preventDefault();pick((i+d+tabs.length)%tabs.length,true)}})});
})();
</script>
</body>
</html>
