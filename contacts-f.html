<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Контакти</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<script src="components/map.js"></script>
<link rel="stylesheet" href="contacts/base.css">
<style>
.pg{display:grid;justify-items:center;gap:56px;padding-block:130px 72px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{min-width:0;box-sizing:border-box}
@media (max-width:720px){.pg{gap:40px;padding-block:110px 48px}}
.head{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:end}
.head h1{margin:0;font-weight:500;font-size:clamp(40px,5.2vw,80px);line-height:.98;letter-spacing:-.055em}
.head p{margin:0;justify-self:end;max-width:420px;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.03em;color:var(--mute)}
.tile{display:grid;gap:10px;align-content:center;padding:24px 28px;border-radius:20px;background:var(--card)}
.tile h2{margin:0;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--mute)}
.tile .v{margin:0;font-weight:500;font-size:clamp(22px,2.2vw,32px);line-height:1.15;letter-spacing:-.04em;overflow-wrap:anywhere}
.tile .v small{display:block;margin-top:4px;font-weight:600;font-size:14px;letter-spacing:-.01em;color:var(--mute)}
.tile.tm{background:var(--ink);color:var(--ds-cream)}
.tile.tm h2{color:rgba(247,242,232,.6)}
.formd{display:grid;align-content:start;gap:16px;padding:clamp(24px,2.6vw,36px);border-radius:20px;background:var(--teal);color:var(--ds-cream)}
.formd h2{margin:0;font-weight:500;font-size:clamp(26px,2.6vw,38px);line-height:1.1;letter-spacing:-.045em}
@media (max-width:1000px){.head{grid-template-columns:minmax(0,1fr)}.head p{justify-self:start}}
@media (max-width:720px){.tile,.formd{border-radius:16px}.tile{padding:20px}.formd{padding:24px 20px}}
/* ВАРІАНТ F · «Три колонки» (з D): пошта й адреса — перша колонка, висока темна колонка з часом — друга, форма — третя; карта в кінці */
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.c1{display:grid;grid-template-rows:1fr 1fr;gap:14px}
.c1 .tile{min-height:150px}
.c2{display:flex;flex-direction:column;justify-content:space-between;gap:28px;padding:24px 28px 28px;border-radius:20px;background:var(--card);color:var(--ink)}
.c2 h2{margin:0;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--mute)}
.slot{display:grid;gap:4px;padding-top:18px;border-top:1px solid var(--line)}
.slot b{font-weight:500;font-size:clamp(56px,6.4vw,104px);line-height:.9;letter-spacing:-.06em;margin-left:-.03em;color:var(--teal-ink)}
.slot span{font-weight:600;font-size:clamp(16px,1.5vw,21px);letter-spacing:-.02em;color:var(--mute)}
.formd .note,.formd .status{max-width:none}
@media (max-width:1100px){.cols3{grid-template-columns:repeat(2,minmax(0,1fr))}.c1{grid-column:1/2}.c2{grid-column:2/3}.formd{grid-column:1/-1}}
@media (max-width:720px){.cols3{grid-template-columns:minmax(0,1fr)}.c1,.c2,.formd{grid-column:1/-1}.c2{border-radius:16px;padding:20px}.slot b{font-size:64px}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"></main>
<site-footer></site-footer>
<script src="contacts/base.js"></script>
<script>
(()=>{
const {esc,S,days,MAIL,addr,formHTML}=CT;
document.getElementById("app").innerHTML=`
  <header class="head row-w"><h1 class="rv">Контакти</h1><p class="rv" style="--d:1">Напишіть нам, залиште заявку або приходьте на недільне служіння — ми раді кожному.</p></header>
  <section class="cols3 row-w" aria-label="Контакти та форма">
    <div class="c1">
      <div class="tile rv"><h2>Пошта</h2><p class="v"><a class="big-link" href="mailto:${esc(MAIL)}" data-no-u>${esc(MAIL)}</a></p></div>
      <div class="tile rv" style="--d:1"><h2>Адреса</h2><p class="v">${esc(addr)}<small>Поряд зі станцією метро «Голосіївська»</small></p></div>
    </div>
    <div class="c2 rv" style="--d:1"><h2>Час основних зібрань</h2>${days.map(d=>`<div class="slot"><b>${esc(d.time)}</b><span>${esc(d.day)}</span></div>`).join("")}</div>
    <div class="formd rv" style="--d:2"><h2>Залишити заявку</h2>${formHTML({dark:true,compact:false})}</div>
  </section>
  <church-map></church-map>`;
CT.init();
})();
</script>
</body>
</html>
