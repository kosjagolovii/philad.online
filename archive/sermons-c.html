<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проповіді</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="sermons/base.css">
<style>
.pg{display:grid;justify-items:center;padding-block:130px 90px;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>.row-w{min-width:0}
.lead{margin:0;max-width:520px;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.03em;color:var(--mute)}
@media (max-width:720px){.pg{padding-block:112px 64px}}
/* ВАРІАНТ C · «Теми першими» — найновіша проповідь, плитки тем, стрічка спікерів, далі добірка */
.feat{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px;margin-bottom:56px}
.feat-img{position:relative;display:block;padding:0;border:0;border-radius:24px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:var(--sand)}
.feat-img img{width:100%;height:100%;object-fit:cover;transition:scale 1s cubic-bezier(.2,.7,.2,1)}
.feat-img:hover img{scale:1.04}
.feat-img .sc-play{opacity:1;scale:1;width:78px;height:78px;margin:-39px 0 0 -39px}
.feat-b{display:grid;align-content:space-between;gap:30px;padding:clamp(24px,3vw,44px);border-radius:24px;background:var(--teal);color:var(--ds-cream)}
.feat-b .kick{color:rgba(247,242,232,.75)}
.feat-b h2{margin:12px 0 0;font-weight:500;font-size:clamp(30px,3.4vw,54px);line-height:1.04;letter-spacing:-.05em;text-wrap:balance}
.feat-b p{margin:0;font-weight:600;font-size:16px;color:rgba(247,242,232,.85)}
.feat-b .go{display:inline-flex;align-items:center;height:48px;padding:0 28px;border:0;border-radius:12px;background:var(--ds-cream);color:var(--ink);cursor:pointer;font:800 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;width:fit-content}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 18px}
.sec-h h2{margin:0;font-weight:500;font-size:clamp(26px,2.8vw,40px);letter-spacing:-.045em}
.sec-h span{font-weight:600;font-size:14px;color:var(--mute)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:48px}
.tile{display:grid;align-content:space-between;gap:34px;min-height:150px;padding:20px 22px;border:0;border-radius:18px;background:var(--card);cursor:pointer;text-align:left;transition:background .25s ease,color .25s ease,scale .35s cubic-bezier(.2,.7,.2,1)}
.tile:hover{scale:1.02}
.tile b{font-weight:500;font-size:clamp(19px,1.7vw,25px);line-height:1.1;letter-spacing:-.04em}
.tile em{font-style:normal;font-weight:700;font-size:13px;color:var(--mute)}
.tile[aria-pressed="true"]{background:var(--ink);color:var(--ds-cream)}
.tile[aria-pressed="true"] em{color:rgba(247,242,232,.6)}
.tile.zero:not([aria-pressed="true"]){opacity:.4;pointer-events:none}
.tile:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.spkr{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 14px;margin:0 -2px 40px;scrollbar-width:thin}
.sp1{flex:none;display:grid;justify-items:center;gap:8px;width:104px;padding:12px 6px;border:0;border-radius:16px;background:none;cursor:pointer;text-align:center;transition:background .2s ease}
.sp1:hover{background:rgba(20,20,20,.05)}
.sp1 img,.sp1 i{width:64px;height:64px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--sand);box-shadow:0 0 0 0 var(--teal);transition:box-shadow .25s ease}
.sp1 i{display:grid;place-items:center;font-style:normal;font-weight:800;font-size:16px;color:var(--teal-ink);background:rgba(49,124,142,.14)}
.sp1 span{font-weight:600;font-size:13px;line-height:1.2;letter-spacing:-.01em}
.sp1 em{font-style:normal;font-weight:700;font-size:11px;color:var(--mute)}
.sp1[aria-pressed="true"] img,.sp1[aria-pressed="true"] i{box-shadow:0 0 0 3px var(--ds-cream),0 0 0 6px var(--teal)}
.sp1.zero:not([aria-pressed="true"]){opacity:.4;pointer-events:none}
.sp1:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 0}
.tools-r{display:flex;flex-wrap:wrap;gap:6px;grid-column:1/-1}
.rinfo{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:14px 0 22px;font-weight:700;font-size:15px}
.act{display:flex;flex-wrap:wrap;gap:6px}
.act .chip{min-height:34px;padding:0 6px 0 14px;background:var(--teal);border-color:var(--teal);color:var(--ds-cream);font-size:14px}
.act .chip::after{content:"×";font-size:18px;line-height:1;width:22px;text-align:center;opacity:.8}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 14px}
@media (max-width:1000px){.feat{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:720px){.feat-img,.feat-b{border-radius:18px}.tile{min-height:110px;gap:18px;padding:16px}.grid3{grid-template-columns:minmax(0,1fr);gap:28px}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"><div class="row-w"><p class="kick">Завантаження…</p></div></main>
<div class="end"><site-footer></site-footer></div>
<script src="sermons/base.js"></script>
<script>
(async()=>{
const SM=window.SM,{esc}=SM;
await SM.load();
const app=document.getElementById("app");
const L=SM.items[0];
app.innerHTML=`<div class="row-w">
  <header style="margin-bottom:28px"><p class="kick">Проповіді</p><h1 class="sm-h1">Проповіді</h1></header>
  <section class="feat" aria-label="Остання проповідь">
    <button class="feat-img" type="button" data-play="${esc(L.id)}" aria-label="Дивитись: ${esc(L.title)}"><img src="${SM.thumb(L.id)}" alt="" onerror="this.onerror=null;this.src='https://i.ytimg.com/vi/${esc(L.id)}/mqdefault.jpg'"><span class="sc-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.9l11-6.8a1 1 0 0 0 0-1.8l-11-6.8A1 1 0 0 0 8 5.2Z" fill="currentColor"/></svg></span></button>
    <div class="feat-b"><div><p class="kick">Остання проповідь</p><h2>${esc(L.title)}</h2></div><div style="display:grid;gap:18px"><p>${esc(L.speaker)} · ${SM.fmtDate(L.date)} · ${SM.fmtDur(L.sec)}</p><button class="go" type="button" data-play="${esc(L.id)}">Дивитись</button></div></div>
  </section>
  <div class="sec-h"><h2>Теми</h2><span>Оберіть одну чи кілька</span></div>
  <div class="tiles" id="tiles"></div>
  <div class="sec-h"><h2>Спікери</h2><span id="spkN"></span></div>
  <div class="spkr" id="spk"></div>
  <div class="tools" id="tools">
    <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Знайти за назвою чи спікером" autocomplete="off"></label>
    <select class="sel" id="sort" aria-label="Сортування"><option value="new">Спочатку нові</option><option value="old">Спочатку старі</option><option value="long">Найдовші</option><option value="short">Найкоротші</option></select>
    <div class="tools-r" id="small"></div>
  </div>
  <div class="rinfo"><span id="count"></span><div class="act" id="act"></div><button class="reset" data-reset id="reset" type="button" hidden>Скинути все</button></div>
  <section class="grid3" id="grid" aria-live="polite"></section>
  <div style="display:grid;justify-items:center;margin-top:44px" id="moreW"></div></div>`;
const q=document.getElementById("q"),sort=document.getElementById("sort");
q.value=SM.state.q;sort.value=SM.state.sort;
q.addEventListener("input",()=>SM.setQ(q.value));
sort.addEventListener("change",()=>SM.setSort(sort.value));
const ini=n=>esc(n.split(" ").map(w=>w[0]).slice(0,2).join(""));
function render(){
  document.getElementById("tiles").innerHTML=SM.facets("topic").map(f=>`<button class="tile${f.count?"":" zero"}" type="button" aria-pressed="${f.active}" data-toggle="topic:${esc(f.value)}"><b>${esc(f.label)}</b><em>${f.count} ${SM.plural(f.count)}</em></button>`).join("");
  const sp=SM.facets("speaker");document.getElementById("spkN").textContent=`${sp.length} спікерів`;
  document.getElementById("spk").innerHTML=sp.map(f=>`<button class="sp1${f.count?"":" zero"}" type="button" aria-pressed="${f.active}" data-toggle="speaker:${esc(f.value)}">${f.avatar?`<img src="${f.avatar}" alt="" loading="lazy">`:`<i aria-hidden="true">${ini(f.label)}</i>`}<span>${esc(f.label)}</span><em>${f.count}</em></button>`).join("");
  document.getElementById("small").innerHTML=["format","dur","year"].map(g=>SM.facets(g).map(f=>`<button class="chip${f.count?"":" zero"}" type="button" aria-pressed="${f.active}" data-toggle="${g}:${esc(f.value)}"><span>${esc(f.label)}</span><em>${f.count}</em></button>`).join("")).join("");
  const list=SM.filtered(),n=list.length;
  document.getElementById("count").textContent=`${n} ${SM.plural(n)}`;
  document.getElementById("reset").hidden=!SM.activeCount();
  document.getElementById("act").innerHTML=SM.activeList().map(a=>`<button class="chip" type="button" data-toggle="${a.group}:${esc(a.value)}" aria-label="Зняти: ${esc(a.label)}">${esc(a.label)}</button>`).join("");
  document.getElementById("grid").innerHTML=n?list.slice(0,SM.state.limit).map(i=>SM.card(i)).join(""):`<div class="empty" style="grid-column:1/-1"><b>Нічого не знайдено</b><span>Спробуйте прибрати частину фільтрів</span><button class="reset" data-reset type="button">Скинути все</button></div>`;
  document.getElementById("moreW").innerHTML=n>SM.state.limit?`<button class="more" data-more type="button">Показати ще ${Math.min(12,n-SM.state.limit)}</button>`:"";
  if(document.activeElement!==q&&q.value!==SM.state.q)q.value=SM.state.q;
}
SM.onChange(render);render();
SM.init();
})();
</script>
</body>
</html>
