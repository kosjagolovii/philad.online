<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Теми домашніх груп</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="hgthemes/base.css">
<style>
.pg{display:grid;justify-items:center;padding-block:130px 90px;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>.row-w{min-width:0}
.hold{position:relative;z-index:1;background:var(--ds-cream)}   /* контент їде вгору й відкриває закріплений футер */
.lead{margin:0;max-width:520px;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.03em;color:var(--mute)}
.guestbtn{width:100%;justify-content:space-between;min-height:48px;background:var(--teal);border-color:var(--teal);color:var(--ds-cream);font-weight:700}
.guestbtn em{color:rgba(247,242,232,.75)}
.guestbtn:hover{border-color:var(--teal-ink);background:var(--teal-ink)}
.guestbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
@media (max-width:720px){.pg{padding-block:112px 64px}}
/* ВАРІАНТ C · «Добірки» — спершу обираєте напрям, потім мітки з нього; є «Для гостей» і «Здивуй мене» */
.hd{margin-bottom:30px}
.hd .lead{margin-top:14px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:14px}
.bigtog{display:grid;align-content:space-between;gap:24px;min-height:150px;padding:26px 28px;border:0;border-radius:20px;background:var(--teal);color:var(--ds-cream);cursor:pointer;text-align:left;transition:background .25s ease,scale .35s cubic-bezier(.2,.7,.2,1)}
.bigtog:hover{scale:1.01;background:var(--teal-ink)}
.bigtog b{font-weight:500;font-size:clamp(24px,2.6vw,38px);line-height:1.05;letter-spacing:-.045em}
.bigtog span{font-weight:600;font-size:14px;color:rgba(247,242,232,.8)}
.bigtog[aria-pressed="true"]{background:var(--ink)}
.bigtog:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.bigtog.rnd{background:var(--card);color:var(--ink)}
.bigtog.rnd:hover{background:#DEDDCD}
.bigtog.rnd span{color:var(--mute)}
.gt{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:12px}
.gtile{display:grid;align-content:space-between;gap:26px;min-height:112px;padding:16px 18px;border:0;border-radius:16px;background:var(--card);cursor:pointer;text-align:left;transition:background .25s ease,color .25s ease}
.gtile:hover{background:#DEDDCD}
.gtile b{font-weight:600;font-size:15px;line-height:1.2;letter-spacing:-.02em}
.gtile em{font-style:normal;font-weight:700;font-size:12px;color:var(--mute)}
.gtile[aria-selected="true"]{background:var(--ink);color:var(--ds-cream)}
.gtile[aria-selected="true"] em{color:rgba(247,242,232,.6)}
.gtile:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.gpanel{display:flex;flex-wrap:wrap;gap:8px;padding:20px;border-radius:16px;background:rgba(20,20,20,.04);margin-bottom:22px;min-height:84px}
.more-f{margin-bottom:22px}
.more-f summary{display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:0 16px;border:1px solid var(--line);border-radius:999px;cursor:pointer;list-style:none;font-weight:700;font-size:14px}
.more-f summary::-webkit-details-marker{display:none}
.more-f summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -2px}
.more-f[open] summary::after{rotate:225deg;translate:0 2px}
.more-f .inner{display:grid;gap:8px;padding:18px 0 4px}
.more-f .sub{padding:6px 0;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.more-f .fl{display:flex;flex-wrap:wrap;gap:6px}
.more-f .chip{min-height:34px;padding:0 12px;font-size:14px}
.tools{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-bottom:6px}
.rinfo{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px;margin:18px 0 22px;font-weight:700;font-size:15px}
.act{display:flex;flex-wrap:wrap;gap:6px}
.act .chip{min-height:34px;padding:0 6px 0 14px;background:var(--teal);border-color:var(--teal);color:var(--ds-cream);font-size:14px}
.act .chip::after{content:"×";font-size:18px;line-height:1;width:22px;text-align:center;opacity:.8}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.grid2 .tc{padding:30px 30px 24px;border-radius:24px}
.grid2 .tc h3{font-size:clamp(26px,2.6vw,38px)}
.grid2 .tc-ex{-webkit-line-clamp:4;font-size:16px}
@media (max-width:1100px){.gt{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.gt{grid-template-columns:repeat(2,minmax(0,1fr))}.bigtog{min-height:110px;padding:20px;border-radius:16px}.gtile{min-height:92px;border-radius:14px}.grid2 .tc{padding:22px 20px 18px;border-radius:18px}.tools{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<div class="end">
  <div class="hold"><main class="pg" id="app"><div class="row-w"><p class="kick">Завантаження…</p></div></main></div>
  <site-footer></site-footer>
</div>
<script src="hgthemes/base.js"></script>
<script>
(async()=>{
const HG=window.HG,{esc}=HG;
await HG.load();
const chip=(g,f)=>`<button class="chip${f.count?"":" zero"}" type="button" aria-pressed="${f.active}" data-toggle="${g}:${esc(f.value)}"><span>${esc(f.label)}</span><em>${f.count}</em></button>`;
const guestBtn=()=>{const n=HG.guestsCount();return `<button class="chip guestbtn${n||HG.state.guests?"":" zero"}" type="button" aria-pressed="${HG.state.guests}" data-toggle="guests:1"><span>Для невоцерковлених гостей</span><em>${n}</em></button>`};
const NAMES={ot:"Старий Заповіт",nt:"Новий Заповіт"};
const app=document.getElementById("app");
let cur=null;
app.innerHTML=`<div class="row-w">
  <header class="hd"><h1 class="sm-h1">Теми домашніх груп</h1><p class="lead" id="lead"></p></header>
  <div class="two"><button class="bigtog" id="gb" type="button" data-toggle="guests:1" aria-pressed="false"><b>Для невоцерковлених гостей</b><span id="gbn"></span></button>
    <button class="bigtog rnd" id="rnd" type="button"><b>Здивуй мене</b><span>Випадкова тема з поточної добірки</span></button></div>
  <div class="gt" id="gt" role="tablist" aria-label="Напрями"></div>
  <div class="gpanel" id="gp" role="tabpanel"></div>
  <details class="more-f"><summary>Книга Біблії і рік</summary><div class="inner"><div data-facet="book"></div><div class="sub">Рік</div><div class="fl" data-facet="year"></div></div></details>
  <div class="tools"><label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Пошук за назвою чи словом з теми" autocomplete="off"></label>
    <select class="sel" id="sort" aria-label="Сортування"><option value="new">Спочатку нові</option><option value="old">Спочатку старі</option><option value="az">За алфавітом</option><option value="q">Більше питань</option></select></div>
  <div class="rinfo"><span id="count"></span><div class="act" id="act"></div><button class="reset" data-reset id="reset" type="button" hidden>Скинути все</button></div>
  <section class="grid2" id="grid" aria-live="polite"></section>
  <div style="display:grid;justify-items:center;margin-top:40px" id="moreW"></div></div>`;
const q=document.getElementById("q"),sort=document.getElementById("sort");
q.value=HG.state.q;sort.value=HG.state.sort;
q.addEventListener("input",()=>HG.setQ(q.value));
sort.addEventListener("change",()=>HG.setSort(sort.value));
document.getElementById("rnd").addEventListener("click",()=>{const l=HG.filtered();if(l.length)window.open(l[Math.floor(Math.random()*l.length)].url,"_blank","noopener")});
document.getElementById("gt").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(b){cur=b.dataset.g;render()}});
function render(){
  const n0=HG.guestsCount();
  const gb=document.getElementById("gb");gb.setAttribute("aria-pressed",HG.state.guests);
  document.getElementById("gbn").textContent=`${n0} ${HG.plural(n0)} — підійдуть для зустрічі з тими, хто ще не ходить до церкви`;
  const tags=HG.facets("tag").filter(f=>f.value!=="guests");
  const gs=HG.data.groups.map(g=>({g,list:tags.filter(f=>f.group===g.id)}));
  if(!cur||!gs.find(x=>x.g.id===cur))cur=(gs.find(x=>x.list.some(f=>f.active))||gs[0]).g.id;
  document.getElementById("gt").innerHTML=gs.map(x=>{const sel=x.list.filter(f=>f.active).length;return `<button class="gtile" type="button" role="tab" data-g="${x.g.id}" aria-selected="${x.g.id===cur}"><b>${esc(x.g.label)}</b><em>${x.list.length} міток${sel?` · обрано ${sel}`:""}</em></button>`}).join("");
  document.getElementById("gp").innerHTML=gs.find(x=>x.g.id===cur).list.map(f=>chip("tag",f)).join("");
  const bk=HG.facets("book");
  document.querySelector('[data-facet="book"]').innerHTML=["ot","nt"].map(t=>`<div class="sub">${NAMES[t]}</div><div class="fl">${bk.filter(f=>f.testament===t).map(f=>chip("book",f)).join("")}</div>`).join("");
  document.querySelector('[data-facet="year"]').innerHTML=HG.facets("year").map(f=>chip("year",f)).join("");
  document.getElementById("lead").textContent=`${HG.items.length} ${HG.plural(HG.items.length)}: оберіть напрям, а в ньому — потрібні мітки`;
  const list=HG.filtered(),n=list.length;
  document.getElementById("count").textContent=`${n} ${HG.plural(n)}`;
  document.getElementById("reset").hidden=!HG.activeCount();
  document.getElementById("act").innerHTML=HG.activeList().map(a=>`<button class="chip" type="button" data-toggle="${a.group}:${esc(a.value)}" aria-label="Зняти: ${esc(a.label)}">${esc(a.label)}</button>`).join("");
  document.getElementById("grid").innerHTML=n?list.slice(0,HG.state.limit).map(i=>HG.card(i,{maxTags:8})).join(""):`<div class="empty" style="grid-column:1/-1"><b>Нічого не знайдено</b><span>Спробуйте прибрати частину фільтрів</span><button class="reset" data-reset type="button">Скинути все</button></div>`;
  document.getElementById("moreW").innerHTML=n>HG.state.limit?`<button class="more" data-more type="button">Показати ще ${Math.min(18,n-HG.state.limit)}</button>`:"";
  if(document.activeElement!==q&&q.value!==HG.state.q)q.value=HG.state.q;
}
HG.onChange(render);render();
HG.init();
})();
</script>
</body>
</html>
