<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Теми домашніх груп</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="hgthemes/base.css">
<style>
.pg{display:grid;justify-items:center;padding-block:130px 90px;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>.row-w{min-width:0}
.hold{position:relative;z-index:1;background:var(--ds-cream)}   /* контент їде вгору й відкриває закріплений футер */
.lead{margin:0;max-width:520px;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.03em;color:var(--mute)}
.guestbtn{width:100%;justify-content:space-between;min-height:48px;background:var(--teal);border-color:var(--teal);color:var(--ds-cream);font-weight:700}
.guestbtn em{color:rgba(247,242,232,.75)}
.guestbtn:hover{border-color:var(--teal-ink);background:var(--teal-ink)}
.guestbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink)}
@media (max-width:720px){.pg{padding-block:112px 64px}}
/* ВАРІАНТ B · «Хмара міток» — усі мітки одразу видно рядами за групами; результати щільним списком */
.hd{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px 40px;margin-bottom:24px}
.cloud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 40px;padding:26px 0;border-block:1px solid var(--line);margin-bottom:22px}
.cl{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:start}
.cl-l{padding-top:10px;font-weight:700;font-size:11px;line-height:1.3;letter-spacing:.06em;text-transform:uppercase;color:var(--teal-ink)}
.cl-c{display:flex;flex-wrap:wrap;gap:6px}
.cl-c .chip{min-height:34px;padding:0 12px;font-size:14px}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:22px}
.fbar .search{flex:1 1 280px}
.fbar .guestbtn{width:auto;min-height:44px}
.dd{position:relative}
.dd>summary{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;list-style:none;font-weight:700;font-size:15px;letter-spacing:-.02em}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -2px}
.dd[open]>summary{border-color:var(--ink)}
.dd>summary b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--teal);color:var(--ds-cream);font-size:12px;font-weight:800}
.dd>summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pop{position:absolute;z-index:6;left:0;top:calc(100% + 8px);width:min(520px,86vw);max-height:380px;overflow:auto;padding:14px;border-radius:16px;background:#fff;box-shadow:0 18px 50px -12px rgba(20,17,15,.35)}
.pop .sub{padding:8px 4px 8px;font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.pop .fl{display:flex;flex-wrap:wrap;gap:6px;padding:0 0 10px}
.pop .chip{min-height:34px;padding:0 12px;font-size:14px}
.cnt{font-weight:700;font-size:15px;letter-spacing:-.02em;margin-left:auto}
.act{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.act .chip{min-height:34px;padding:0 6px 0 14px;background:var(--teal);border-color:var(--teal);color:var(--ds-cream);font-size:14px}
.act .chip::after{content:"×";font-size:18px;line-height:1;width:22px;text-align:center;opacity:.8}
.tl{display:grid}
.tr{display:grid;grid-template-columns:130px minmax(0,1.6fr) minmax(0,1.2fr) minmax(0,.7fr);gap:8px 28px;align-items:start;padding:20px 8px;border-top:1px solid var(--line);transition:background .2s ease}
.tr:last-child{border-bottom:1px solid var(--line)}
.tr:hover{background:rgba(20,20,20,.035)}
.tr time{padding-top:6px;font-weight:600;font-size:13px;color:var(--mute)}
.tr h3{margin:0;font-weight:500;font-size:clamp(20px,1.8vw,26px);line-height:1.12;letter-spacing:-.04em}
.tr h3 a{color:inherit;text-decoration:none}.tr h3 a:hover{color:var(--teal-ink)}
.tr h3 a:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:4px}
.tr-ex{margin:8px 0 0;font-weight:500;font-size:14px;line-height:1.4;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tr-t{display:flex;flex-wrap:wrap;gap:6px;padding-top:4px}
.tr-t button{padding:5px 11px;border:0;border-radius:999px;background:rgba(20,20,20,.07);cursor:pointer;font-weight:600;font-size:12px;color:var(--soft);transition:background .2s ease,color .2s ease}
.tr-t button:hover{background:var(--teal);color:var(--ds-cream)}
.tr-t .g{background:var(--teal);color:var(--ds-cream)}
.tr-r{padding-top:6px;font-weight:600;font-size:13px;line-height:1.4;color:var(--mute)}
@media (max-width:1100px){.cloud{grid-template-columns:minmax(0,1fr)}.tr{grid-template-columns:110px minmax(0,1fr)}.tr-t,.tr-r{grid-column:2/3}}
@media (max-width:720px){.cl{grid-template-columns:minmax(0,1fr);gap:6px}.cl-l{padding:0}.tr{grid-template-columns:minmax(0,1fr)}.tr-t,.tr-r{grid-column:auto}.tr time{padding:0}.cnt{margin-left:0}.pop{left:0}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<div class="end">
  <div class="hold"><main class="pg" id="app"><div class="row-w"><p class="kick">Завантаження…</p></div></main></div>
  <site-footer></site-footer>
</div>
<script src="hgthemes/base.js"></script>
<script>
(async()=>{
const HG=window.HG,{esc}=HG;
await HG.load();
const chip=(g,f)=>`<button class="chip${f.count?"":" zero"}" type="button" aria-pressed="${f.active}" data-toggle="${g}:${esc(f.value)}"><span>${esc(f.label)}</span><em>${f.count}</em></button>`;
const guestBtn=()=>{const n=HG.guestsCount();return `<button class="chip guestbtn${n||HG.state.guests?"":" zero"}" type="button" aria-pressed="${HG.state.guests}" data-toggle="guests:1"><span>Для невоцерковлених гостей</span><em>${n}</em></button>`};
const NAMES={ot:"Старий Заповіт",nt:"Новий Заповіт"};
const app=document.getElementById("app");
app.innerHTML=`<div class="row-w">
  <header class="hd"><div><h1 class="sm-h1">Теми домашніх груп</h1></div><p class="lead" id="lead"></p></header>
  <div class="cloud" id="cloud">${HG.data.groups.map(g=>`<div class="cl"><span class="cl-l">${esc(g.label)}</span><div class="cl-c" data-grp="${g.id}"></div></div>`).join("")}</div>
  <div class="fbar">
    <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Пошук за назвою чи словом з теми" autocomplete="off"></label>
    <span id="guests"></span>
    <details class="dd" data-dd="book"><summary>Книга Біблії</summary><div class="pop" data-facet="book"></div></details>
    <details class="dd" data-dd="year"><summary>Рік</summary><div class="pop"><div class="fl" data-facet="year"></div></div></details>
    <select class="sel" id="sort" aria-label="Сортування"><option value="new">Спочатку нові</option><option value="old">Спочатку старі</option><option value="az">За алфавітом</option><option value="q">Більше питань</option></select>
    <span class="cnt" id="count"></span><button class="reset" data-reset id="reset" type="button" hidden>Скинути все</button>
  </div>
  <div class="act" id="act"></div>
  <section class="tl" id="grid" aria-live="polite"></section>
  <div style="display:grid;justify-items:center;margin-top:36px" id="moreW"></div></div>`;
const q=document.getElementById("q"),sort=document.getElementById("sort");
q.value=HG.state.q;sort.value=HG.state.sort;
q.addEventListener("input",()=>HG.setQ(q.value));
sort.addEventListener("change",()=>HG.setSort(sort.value));
const dds=[...document.querySelectorAll(".dd")];
dds.forEach(d=>d.addEventListener("toggle",()=>{if(d.open)dds.forEach(o=>{if(o!==d)o.open=false})}));
document.addEventListener("click",e=>{if(!e.target.closest(".dd"))dds.forEach(d=>d.open=false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")dds.forEach(d=>d.open=false)});
const row=it=>{
  const tg=it.tags;
  return `<article class="tr"><time datetime="${esc(it.date)}">${HG.fmtDate(it.date)}</time>
    <div><h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a></h3>${it.excerpt?`<p class="tr-ex">${esc(it.excerpt)}</p>`:""}</div>
    <div class="tr-t">${tg.map(t=>t==="guests"?`<button type="button" class="g" data-toggle="guests:1">Для гостей</button>`:`<button type="button" data-toggle="tag:${esc(t)}">${esc(HG.tagLabel[t])}</button>`).join("")}</div>
    <div class="tr-r">${it.refs.slice(0,3).map(esc).join(" · ")}${it.refs.length>3?" · …":""}${it.q?`<br>${it.q} питань`:""}</div></article>`;
};
function render(){
  document.getElementById("guests").innerHTML=guestBtn();
  const tags=HG.facets("tag").filter(f=>f.value!=="guests");
  HG.data.groups.forEach(g=>{document.querySelector(`[data-grp="${g.id}"]`).innerHTML=tags.filter(f=>f.group===g.id).map(f=>chip("tag",f)).join("")});
  const bk=HG.facets("book");
  document.querySelector('[data-facet="book"]').innerHTML=["ot","nt"].map(t=>`<div class="sub">${NAMES[t]}</div><div class="fl">${bk.filter(f=>f.testament===t).map(f=>chip("book",f)).join("")}</div>`).join("");
  document.querySelector('[data-facet="year"]').innerHTML=HG.facets("year").map(f=>chip("year",f)).join("");
  [["book","Книга Біблії"],["year","Рік"]].forEach(([g,l])=>{const n=HG.state[g].size;document.querySelector(`[data-dd="${g}"]>summary`).innerHTML=l+(n?` <b>${n}</b>`:"")});
  const list=HG.filtered(),n=list.length;
  document.getElementById("count").textContent=`${n} ${HG.plural(n)}`;
  document.getElementById("lead").textContent=`${HG.items.length} ${HG.plural(HG.items.length)} для домашніх груп`;
  document.getElementById("reset").hidden=!HG.activeCount();
  document.getElementById("act").innerHTML=HG.activeList().map(a=>`<button class="chip" type="button" data-toggle="${a.group}:${esc(a.value)}" aria-label="Зняти: ${esc(a.label)}">${esc(a.label)}</button>`).join("");
  document.getElementById("grid").innerHTML=n?list.slice(0,HG.state.limit).map(row).join(""):`<div class="empty"><b>Нічого не знайдено</b><span>Спробуйте прибрати частину фільтрів</span><button class="reset" data-reset type="button">Скинути все</button></div>`;
  document.getElementById("moreW").innerHTML=n>HG.state.limit?`<button class="more" data-more type="button">Показати ще ${Math.min(18,n-HG.state.limit)}</button>`:"";
  if(document.activeElement!==q&&q.value!==HG.state.q)q.value=HG.state.q;
}
HG.onChange(render);render();
HG.init();
})();
</script>
</body>
</html>
