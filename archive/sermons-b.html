<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Проповіді</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="sermons/base.css">
<style>
.pg{display:grid;justify-items:center;padding-block:130px 90px;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>.row-w{min-width:0}
.lead{margin:0;max-width:520px;font-weight:600;font-size:17px;line-height:1.35;letter-spacing:-.03em;color:var(--mute)}
@media (max-width:720px){.pg{padding-block:112px 64px}}
/* ВАРІАНТ B · «Верхня панель» — велика пошукова стрічка, ряд тем і випадні фільтри; результати списком */
.hd{display:grid;gap:22px;margin-bottom:26px}
.hd-t{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px 40px}
.topics{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px;scrollbar-width:none}
.topics::-webkit-scrollbar{display:none}
.topics .chip{flex:none}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 0;border-block:1px solid var(--line);margin-bottom:26px}
.dd{position:relative}
.dd>summary{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 18px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;list-style:none;font-weight:700;font-size:15px;letter-spacing:-.02em;transition:border-color .2s ease}
.dd>summary::-webkit-details-marker{display:none}
.dd>summary::after{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;rotate:45deg;translate:0 -2px}
.dd[open]>summary{border-color:var(--ink)}
.dd>summary b{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:var(--teal);color:var(--ds-cream);font-size:12px;font-weight:800}
.dd>summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.pop{position:absolute;z-index:6;left:0;top:calc(100% + 8px);width:min(340px,86vw);max-height:360px;overflow:auto;padding:12px;border-radius:16px;background:#fff;box-shadow:0 18px 50px -12px rgba(20,17,15,.35);display:grid;gap:2px}
.pop .chip{display:flex;justify-content:flex-start;gap:10px;border:0;border-radius:10px;min-height:42px;padding:0 10px;width:100%;font-size:15px}
.pop .chip span{flex:1;text-align:left}
.pop .chip:hover{background:rgba(20,20,20,.06)}
.pop .chip[aria-pressed="true"]{background:var(--ink)}
.pop img,.pop i{width:30px;height:30px;border-radius:50%;object-fit:cover;object-position:50% 20%;background:var(--sand);flex:none}
.pop i{display:grid;place-items:center;font-style:normal;font-weight:800;font-size:10px;color:var(--teal-ink);background:rgba(49,124,142,.14)}
.sp{flex:1}
.cnt{font-weight:700;font-size:15px;letter-spacing:-.02em}
.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px 40px}
@media (max-width:1100px){.list{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.fbar{gap:6px}.dd>summary{padding:0 14px}.sp{display:none}.list{gap:28px}.pop{left:0}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"><div class="row-w"><p class="kick">Завантаження…</p></div></main>
<div class="end"><site-footer></site-footer></div>
<script src="sermons/base.js"></script>
<script>
(async()=>{
const SM=window.SM,{esc}=SM;
await SM.load();
const app=document.getElementById("app");
app.innerHTML=`<div class="row-w">
  <header class="hd">
    <div class="hd-t"><div><p class="kick">Проповіді</p><h1 class="sm-h1">Проповіді</h1></div><p class="lead" id="lead"></p></div>
    <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m14 14 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Знайти проповідь за назвою чи спікером" autocomplete="off"></label>
    <div class="topics" id="topics" role="group" aria-label="Теми"></div>
  </header>
  <div class="fbar" id="bar">
    <details class="dd" data-dd="speaker"><summary>Спікер</summary><div class="pop" data-facet="speaker"></div></details>
    <details class="dd" data-dd="format"><summary>Формат</summary><div class="pop" data-facet="format"></div></details>
    <details class="dd" data-dd="dur"><summary>Тривалість</summary><div class="pop" data-facet="dur"></div></details>
    <details class="dd" data-dd="year"><summary>Рік</summary><div class="pop" data-facet="year"></div></details>
    <button class="reset" data-reset id="reset" type="button" hidden>Скинути все</button>
    <span class="sp"></span><span class="cnt" id="count"></span>
    <select class="sel" id="sort" aria-label="Сортування"><option value="new">Спочатку нові</option><option value="old">Спочатку старі</option><option value="long">Найдовші</option><option value="short">Найкоротші</option></select>
  </div>
  <section class="list" id="grid" aria-live="polite"></section>
  <div style="display:grid;justify-items:center;margin-top:40px" id="moreW"></div></div>`;
const q=document.getElementById("q"),sort=document.getElementById("sort");
q.value=SM.state.q;sort.value=SM.state.sort;
q.addEventListener("input",()=>SM.setQ(q.value));
sort.addEventListener("change",()=>SM.setSort(sort.value));
const dds=[...document.querySelectorAll(".dd")];
dds.forEach(d=>d.addEventListener("toggle",()=>{if(d.open)dds.forEach(o=>{if(o!==d)o.open=false})}));
document.addEventListener("click",e=>{if(!e.target.closest(".dd"))dds.forEach(d=>d.open=false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape")dds.forEach(d=>d.open=false)});
const chip=(g,f,extra)=>`<button class="chip${f.count?"":" zero"}" type="button" aria-pressed="${f.active}" data-toggle="${g}:${esc(f.value)}">${extra||""}<span>${esc(f.label)}</span><em>${f.count}</em></button>`;
const NAMES={speaker:"Спікер",format:"Формат",dur:"Тривалість",year:"Рік"};
function render(){
  document.getElementById("topics").innerHTML=SM.facets("topic").map(f=>chip("topic",f)).join("");
  ["speaker","format","dur","year"].forEach(g=>{
    document.querySelector(`[data-facet="${g}"]`).innerHTML=SM.facets(g).map(f=>chip(g,f,g==="speaker"?(f.avatar?`<img src="${f.avatar}" alt="" loading="lazy">`:`<i aria-hidden="true">${esc(f.label.split(" ").map(w=>w[0]).slice(0,2).join(""))}</i>`):"")).join("");
    const n=SM.state[g].size;document.querySelector(`[data-dd="${g}"]>summary`).innerHTML=NAMES[g]+(n?` <b>${n}</b>`:"");
  });
  const list=SM.filtered(),n=list.length;
  document.getElementById("count").textContent=`${n} ${SM.plural(n)}`;
  document.getElementById("lead").textContent=`${SM.items.length} ${SM.plural(SM.items.length)} в архіві`;
  document.getElementById("reset").hidden=!SM.activeCount();
  document.getElementById("grid").innerHTML=n?list.slice(0,SM.state.limit).map(i=>SM.card(i,{row:true})).join(""):`<div class="empty" style="grid-column:1/-1"><b>Нічого не знайдено</b><span>Спробуйте прибрати частину фільтрів</span><button class="reset" data-reset type="button">Скинути все</button></div>`;
  document.getElementById("moreW").innerHTML=n>SM.state.limit?`<button class="more" data-more type="button">Показати ще ${Math.min(12,n-SM.state.limit)}</button>`:"";
  if(document.activeElement!==q&&q.value!==SM.state.q)q.value=SM.state.q;
}
SM.onChange(render);render();
SM.init();
})();
</script>
</body>
</html>
