<style>
/* «Графік служінь»: день, час і назва зібрання в рядку-таблиці. Основа сторінки (.pg) і карта <church-map> — як на «Контактах»; текст — з токенів UI-кіта. Текст зі старої сторінки philad.org/grafik-sluzheniy/. */
.pg{position:relative;z-index:1;background:var(--ds-cream);display:grid;justify-items:center;gap:56px;padding-block:130px 72px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{min-width:0;box-sizing:border-box}
@media (max-width:720px){.pg{gap:40px;padding-block:110px 48px}}
.head{display:grid;justify-items:center;gap:18px;text-align:center}
.head h1{margin:0;font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track);text-wrap:balance}
.head p{margin:0;max-width:640px;font:var(--t1-weight) var(--t1-size)/var(--t1-lh) var(--font);letter-spacing:var(--t1-track);color:var(--mute);text-wrap:balance}
.tt{width:var(--row);max-width:100%;margin:0;padding:0;list-style:none;border-top:1.5px solid var(--line)}
.tt li{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.8fr) minmax(0,1.3fr);gap:8px 32px;align-items:baseline;padding:24px 0;border-bottom:1.5px solid var(--line)}
.tt .d{font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track)}
.tt .t{font:var(--h3-weight) var(--h3-size)/var(--h3-lh) var(--font);letter-spacing:var(--h3-track);color:var(--teal-ink);font-variant-numeric:tabular-nums}
.tt .n{font:var(--t1-weight) var(--t1-size)/var(--t1-lh) var(--font);letter-spacing:var(--t1-track)}
.tt li.main .d{color:var(--teal-ink)}
@media (max-width:900px){.tt li{grid-template-columns:minmax(0,1fr);gap:4px;padding:22px 0}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app">
  <header class="head row-w"><h1 class="rv">Графік служінь</h1><p class="rv" style="--d:1">Будемо раді Вас бачити на зібраннях церкви «Філадельфія»</p></header>
  <ul class="tt">
    <li class="rv main"><span class="d">Неділя</span><span class="t">11:00</span><span class="n">Недільне зібрання</span></li>
    <li class="rv"><span class="d">Вівторок</span><span class="t">7:30–8:30</span><span class="n">Ранкова молитва за Україну</span></li>
    <li class="rv"><span class="d">Середа</span><span class="t">19:00–20:00</span><span class="n">Молитовне зібрання</span></li>
    <li class="rv"><span class="d">Четвер</span><span class="t">8:00–8:30</span><span class="n">Ранкова молитва за Україну</span></li>
    <li class="rv"><span class="d">Субота</span><span class="t">17:00</span><span class="n">Молодіжне зібрання</span></li>
  </ul>
  <church-map></church-map>
</main>
<site-footer></site-footer>
<script>
(()=>{const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -8% 0px"});document.querySelectorAll(".rv").forEach(el=>io.observe(el))})();
</script>
</body>
