<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Пожертви</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="donate/base.css">
<style>
/* ВАРІАНТ B · «Темна обкладинка» — темний перший екран із великим QR, нижче світлі картки з реквізитами */
.pad{padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.wrap{width:var(--row);max-width:100%;margin-inline:auto;box-sizing:border-box;min-width:0}
.dk{background:var(--ink);color:var(--ds-cream);padding-block:150px 100px}
.dk .kicker{color:rgba(247,242,232,.6)}
.hero{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
.hero-t{grid-column:1/4;display:grid;gap:28px;align-self:stretch;align-content:space-between}
.hero-t h1{font-weight:500;font-size:clamp(56px,10.5vw,170px);line-height:.88;letter-spacing:-.065em;margin-left:-.04em}
.hero-b{display:grid;gap:26px;max-width:620px}
.hero-b .lead{font-weight:500;font-size:clamp(18px,1.7vw,24px);line-height:1.35;letter-spacing:-.03em;color:rgba(247,242,232,.8);text-wrap:pretty}
.acts{display:flex;flex-wrap:wrap;gap:10px}
.btn-l{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 33px;border-radius:12px;background:var(--ds-cream);color:var(--ink);text-decoration:none;
  font:800 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;transition:scale .35s cubic-bezier(.2,.7,.2,1)}
.btn-l:hover{scale:1.04}
.btn-g{display:inline-flex;align-items:center;justify-content:center;height:48px;padding:0 33px;border-radius:12px;background:rgba(247,242,232,.12);color:var(--ds-cream);text-decoration:none;
  font:800 12px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;transition:scale .35s cubic-bezier(.2,.7,.2,1),background .25s ease}
.btn-g:hover{scale:1.04;background:rgba(247,242,232,.2)}
.btn-l:focus-visible,.btn-g:focus-visible{outline:2px solid var(--ds-cream);outline-offset:3px}
.hero-q{display:grid;gap:14px}
.hero-q .qr{border-radius:24px}
.hero-q p{font-weight:600;font-size:14px;line-height:1.35;letter-spacing:-.01em;color:rgba(247,242,232,.7)}

.lt{display:grid;gap:14px;padding-block:100px 120px}
.accs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.acc{padding:clamp(24px,3vw,44px);border-radius:24px;background:var(--card);display:grid;gap:6px}
.acc-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:20px}
.acc-h h2{font-weight:500;font-size:clamp(28px,3.2vw,46px);line-height:1.04;letter-spacing:-.045em}
.acc-h span{display:grid;place-items:center;height:36px;padding:0 14px;border-radius:999px;background:var(--teal);color:var(--ds-cream);font-weight:800;font-size:12px;letter-spacing:.04em}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:15px 0;border-top:1px solid var(--line)}
.row dt{grid-column:1/-1;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--mute)}
.row dd{margin:0;font-weight:500;font-size:clamp(18px,1.6vw,22px);line-height:1.3;letter-spacing:-.025em;overflow-wrap:anywhere}
.row dd.mono{font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.note{padding:0 6px;font-weight:600;font-size:14px;line-height:1.4;letter-spacing:-.01em;color:var(--mute)}

@media (max-width:1000px){
  .hero{grid-template-columns:minmax(0,1fr)}.hero-t{grid-column:1/-1;gap:36px}
  .hero-q{max-width:380px}
  .accs{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:720px){
  .dk{padding-block:120px 56px}
  .lt{padding-block:56px 72px}
  .acc,.hero-q .qr{border-radius:16px}
  .acts>*{flex:1 1 100%}
}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main id="app"></main>
<site-footer></site-footer>
<script src="donate/data.js"></script>
<script src="donate/base.js"></script>
<script>
(()=>{
const D=window.DONATE,{esc,copyBtn}=DN;
document.getElementById("app").innerHTML=`
  <section class="dk pad dk-on" data-dark>
    <div class="wrap hero">
      <div class="hero-t">
        <p class="kicker rv">${esc(D.kicker)}</p>
        <h1 class="rv" style="--d:1">${esc(D.title)}</h1>
        <div class="hero-b rv" style="--d:2">
          <p class="lead">${esc(D.lead)}</p>
          <div class="acts"><a class="btn-l" href="${esc(D.online.href)}" target="_blank" rel="noopener">${esc(D.online.label)}</a><a class="btn-g" href="${esc(D.mono.href)}" target="_blank" rel="noopener">${esc(D.mono.label)}</a></div>
        </div>
      </div>
      <aside class="hero-q rv" style="--d:2" aria-label="QR-код для оплати">
        <div class="qr"><img src="${esc(D.qr.src)}" alt="${esc(D.qr.alt)}" width="557" height="557"></div>
        <p>${esc(D.qr.caption)}</p>
      </aside>
    </div>
  </section>
  <div class="lt pad"><div class="wrap">
    <div class="accs">${D.accounts.map((a,i)=>`
      <section class="acc rv" style="--d:${i}" aria-labelledby="h-${a.id}">
        <div class="acc-h"><h2 id="h-${a.id}">${esc(a.title)}</h2><span>${esc(a.tab)}</span></div>
        <dl style="margin:0">${a.rows.map(r=>`<div class="row"><dt>${esc(r.k)}</dt><dd${r.mono?' class="mono"':""}>${esc(r.v)}</dd>${r.copy?copyBtn(r.v,r.k):""}</div>`).join("")}</dl>
      </section>`).join("")}
    </div>
  </div></div>`;
DN.init();
})();
</script>
</body>
</html>
