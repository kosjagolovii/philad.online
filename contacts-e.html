<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Контакти</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<script src="components/map.js"></script>
<link rel="stylesheet" href="contacts/base.css">
<style>
.pg{display:grid;justify-items:center;gap:56px;padding-block:130px 72px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{min-width:0;box-sizing:border-box}
@media (max-width:720px){.pg{gap:40px;padding-block:110px 48px}}
/* ВАРІАНТ E · «Смуга» — максимально компактно: контакти одним рядком-смугою, форма в кілька полів, карта в кінці */
.top{display:flex;align-items:end;justify-content:space-between;gap:24px 40px;flex-wrap:wrap}
.top h1{margin:0;font-weight:500;font-size:clamp(40px,5.2vw,80px);line-height:.98;letter-spacing:-.055em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:10px;height:48px;padding:0 20px;border-radius:999px;background:var(--card);align-items:center;font-weight:600;font-size:15px;letter-spacing:-.02em}
.chip b{font-weight:500;font-size:20px;letter-spacing:-.03em;color:var(--teal-ink)}
.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-radius:20px;background:var(--card);overflow:hidden}
.cell{display:grid;gap:6px;padding:22px 28px;border-left:1px solid var(--line)}
.cell:first-child{border-left:0}
.cell h2{margin:0;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--mute)}
.cell .v{margin:0;font-weight:500;font-size:clamp(20px,1.9vw,28px);line-height:1.2;letter-spacing:-.035em;overflow-wrap:anywhere}
.cell .v small{display:block;margin-top:2px;font-weight:600;font-size:13px;letter-spacing:-.01em;color:var(--mute)}
.fe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px 40px;align-items:start;padding:clamp(24px,3vw,44px);border-radius:20px;background:var(--teal);color:var(--ds-cream)}
.fe h2{margin:0;font-weight:500;font-size:clamp(28px,3vw,44px);line-height:1.08;letter-spacing:-.045em}
.fe p.t{margin:14px 0 0;max-width:300px;font-weight:600;font-size:15px;line-height:1.4;letter-spacing:-.015em;color:rgba(247,242,232,.8)}
@media (max-width:1000px){.strip{grid-template-columns:minmax(0,1fr)}.cell{border-left:0;border-top:1px solid var(--line)}.cell:first-child{border-top:0}.fe{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.strip,.fe{border-radius:16px}.cell{padding:18px 20px}.fe{padding:26px 20px}.chip{height:44px;padding:0 16px}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg" id="app"></main>
<site-footer></site-footer>
<script src="contacts/base.js"></script>
<script>
(()=>{
const {esc,S,days,MAIL,addr,formHTML}=CT;
document.getElementById("app").innerHTML=`
  <header class="top row-w"><h1 class="rv">Контакти</h1><div class="chips rv" style="--d:1" role="group" aria-label="Час основних зібрань">${days.map(d=>`<span class="chip"><b>${esc(d.time)}</b>${esc(d.day)}</span>`).join("")}</div></header>
  <section class="strip row-w rv" aria-label="Контакти">
    <div class="cell"><h2>Пошта</h2><p class="v"><a class="big-link" href="mailto:${esc(MAIL)}" data-no-u>${esc(MAIL)}</a></p></div>
    <div class="cell"><h2>Адреса</h2><p class="v">${esc(addr)}<small>Поряд зі станцією метро «Голосіївська»</small></p></div>
  </section>
  <section class="fe row-w rv" data-dark aria-labelledby="fe-h">
    <div><h2 id="fe-h">Залишити заявку</h2><p class="t">Напишіть нам або приходьте на недільне служіння — ми раді кожному.</p></div>
    ${formHTML({dark:true,compact:true})}
  </section>
  <church-map></church-map>`;
CT.init();
})();
</script>
</body>
</html>
