.pg{position:relative;z-index:1;background:var(--ds-cream);display:grid;justify-items:center;gap:56px;padding-block:130px 72px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{min-width:0;box-sizing:border-box}
@media (max-width:720px){.pg{gap:40px;padding-block:110px 40px}}
/* ОСНОВНА (варіант D «Мозаїка») — компактно: заголовок у рядок, плитки зліва, форма справа на всю висоту; карта в кінці */
.head{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:end}
.head h1{margin:0;font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track)}
.head p{margin:0;justify-self:end;max-width:420px;font:var(--t1-weight) var(--t1-size)/var(--t1-lh) var(--font);letter-spacing:var(--t1-track);color:var(--mute)}
.mos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:stretch}
.stack{display:grid;grid-template-rows:repeat(3,auto);gap:14px}
.tile{display:grid;gap:10px;align-content:center;min-height:132px;padding:24px 28px;border-radius:20px;background:var(--card)}
.tile h2{margin:0;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}
.tile .v{margin:0;font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track);overflow-wrap:anywhere}
.tile .v small{display:block;margin-top:4px;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}
.tile.tm .v{display:flex;flex-wrap:wrap;gap:6px 36px}
.tile.tm .v span{display:grid;gap:2px;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}
.tile.tm .v b{font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track);color:var(--ink)}
.formd{display:grid;align-content:start;gap:16px;padding:clamp(24px,2.6vw,36px);border-radius:20px;background:var(--teal);color:var(--ds-cream)}
/* форма на всю висоту блоку: поле «Повідомлення» росте разом із плитками зліва */
.formd{display:flex;flex-direction:column}
.formd .cf{flex:1;display:flex;flex-direction:column}
.formd .cf .fields{flex:1;display:flex!important;flex-direction:column}
.formd .cf .fields>label:has(textarea){flex:1;grid-template-rows:auto 1fr}
.formd .cf textarea{height:100%;min-height:84px;resize:none}
.formd .cf .note{margin-top:auto}
.formd h2{margin:0;font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track)}
@media (max-width:1000px){.mos{grid-template-columns:minmax(0,1fr)}.head{grid-template-columns:minmax(0,1fr)}.head p{justify-self:start}}
@media (max-width:720px){.tile,.formd{border-radius:16px}.tile{min-height:0;padding:16px}.formd{padding:24px 16px}}

(()=>{
const {esc,S,days,MAIL,addr,formHTML}=CT;
document.getElementById("app").innerHTML=`
  <header class="head row-w"><h1 class="rv">Контакти</h1><p class="rv" style="--d:1">Напишіть нам, залиште заявку або приходьте на недільне служіння — ми раді кожному.</p></header>
  <section class="mos row-w" aria-label="Контакти та форма">
    <div class="stack">
      <div class="tile rv"><h2>Пошта</h2><p class="v"><a class="big-link" href="mailto:${esc(MAIL)}" data-no-u>${esc(MAIL)}</a></p></div>
      <div class="tile rv" style="--d:1"><h2>Адреса</h2><p class="v">${esc(addr)}<small>Поряд зі станцією метро «Голосіївська»</small></p></div>
      <div class="tile tm rv" style="--d:2"><h2>Час основних зібрань</h2><p class="v">${days.map(d=>`<span><b>${esc(d.time)}</b>${esc(d.day)}</span>`).join("")}</p></div>
    </div>
    <div class="formd rv" style="--d:1"><h2>Залишити заявку</h2>${formHTML({dark:true,compact:true})}</div>
  </section>
  <church-map></church-map>`;
CT.init({switcher:false});
