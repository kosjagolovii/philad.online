<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Про нас</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="about/base.css">
<style>
/* ВАРІАНТ B3 · «Обкладинка» — фото служіння на весь перший екран, пастори великими рядками, місія — темна панель із перемикачем */
.pad{padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.wrap{width:var(--row);max-width:100%;margin-inline:auto;box-sizing:border-box;min-width:0}
h2{font-weight:500;font-size:clamp(30px,3.5vw,50px);line-height:1.12;letter-spacing:-.04em;text-wrap:balance}

/* обкладинка */
.cover{position:relative;display:flex;align-items:flex-end;min-height:100vh;min-height:100svh;background:var(--ink);color:var(--ds-cream);overflow:hidden;padding-bottom:clamp(28px,5vh,56px);box-sizing:border-box}
.cover>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;animation:zoom 2.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes zoom{from{scale:1.08}}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(20,17,15,.92) 0%,rgba(20,17,15,.45) 45%,rgba(20,17,15,.35) 100%)}
.cover .wrap{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:14px}
.cover h1{font-weight:500;font-size:clamp(64px,12vw,200px);line-height:.86;letter-spacing:-.065em;margin-left:-.04em}
.cover p{max-width:480px;justify-self:end;font-weight:500;font-size:clamp(20px,2vw,28px);line-height:1.25;letter-spacing:-.035em;color:rgba(247,242,232,.85);text-wrap:balance;padding-bottom:.4em}

/* темна частина: пастори рядками, диякони списком */
.dk{background:var(--ink);color:var(--ds-cream);padding-block:110px}
.dk .wrap{display:grid;gap:110px}
.dk .kicker{color:rgba(247,242,232,.6)}
.pas{display:grid;gap:14px}
.pa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch}
.pa figure{grid-column:1/4;aspect-ratio:16/10;border-radius:20px;overflow:hidden;background:#232323}
.pa img{width:100%;height:100%;object-fit:cover;object-position:50% 47%;transition:scale 1.2s cubic-bezier(.2,.7,.2,1)}
.pa:hover img{scale:1.04}
.pa-t{grid-column:4/5;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:24px;border-radius:20px;background:rgba(247,242,232,.07)}
.pa-t i{font-style:normal;font-weight:600;font-size:14px;color:rgba(247,242,232,.4);font-variant-numeric:tabular-nums}
.pa-t div{display:grid;gap:12px}
.pa-t h3{font-weight:500;font-size:clamp(28px,3vw,46px);line-height:1;letter-spacing:-.05em}
.pa:nth-child(even) figure{grid-column:2/5;order:2}
.pa:nth-child(even) .pa-t{grid-column:1/2}

.dea-w{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:30px 14px;align-items:start}
.dea-w h2{grid-column:1/2}
.dea{grid-column:2/5;columns:2;column-gap:14px;border-top:1px solid rgba(247,242,232,.16)}
.de{break-inside:avoid;display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid rgba(247,242,232,.16)}
.de-ph{flex:none;width:52px;height:52px;border-radius:50%;overflow:hidden}
.de-ph>*{width:100%;height:100%;object-fit:cover}
.dk .noph{background:rgba(247,242,232,.08);color:rgba(247,242,232,.3)}
.de b{font-weight:500;font-size:clamp(18px,1.7vw,24px);line-height:1.2;letter-spacing:-.03em}
.dk .is-empty{color:rgba(247,242,232,.35)}

/* світла частина */
.lt{display:grid;gap:120px;padding-block:120px}
.abt{display:grid;gap:56px}
.abt-h{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.abt-h .kicker{grid-column:1/2;padding-top:.9em}
.abt-h h2{grid-column:2/5;font-size:clamp(28px,3.6vw,56px);line-height:1.08;letter-spacing:-.05em}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.col{display:grid;align-content:start;gap:22px;padding-top:22px;border-top:1px solid var(--line)}
.col b{font-weight:500;font-size:clamp(28px,3vw,46px);line-height:1;letter-spacing:-.05em;color:var(--teal-ink)}
.col .prose{font-size:16px;padding-right:12px}
.wide{aspect-ratio:21/9;border-radius:20px;overflow:hidden;background:var(--sand)}
.wide img{width:100%;height:100%;object-fit:cover;object-position:50% 64%}

/* місія: темна панель із перемикачем */
.mis{display:grid;gap:clamp(40px,6vw,80px);padding:clamp(28px,4.4vw,64px);border-radius:20px;background:var(--ink);color:var(--ds-cream)}
.mis-h{display:grid;gap:20px}
.mis-h .kicker{color:rgba(247,242,232,.6)}
.mis-h h2{max-width:1000px;font-size:clamp(28px,3.8vw,58px);line-height:1.06;letter-spacing:-.05em}
.tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px;align-items:start}
.tablist{display:grid;border-top:1px solid rgba(247,242,232,.16)}
.tab{display:flex;align-items:baseline;gap:18px;width:100%;padding:22px 0;border:0;border-bottom:1px solid rgba(247,242,232,.16);background:none;color:rgba(247,242,232,.4);font:inherit;text-align:left;cursor:pointer;transition:color .3s ease}
.tab i{flex:none;font-style:normal;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums;color:rgba(247,242,232,.4)}
.tab b{font-weight:500;font-size:clamp(24px,2.7vw,40px);line-height:1.05;letter-spacing:-.045em;transition:translate .45s cubic-bezier(.2,.7,.2,1)}
.tab:hover{color:rgba(247,242,232,.8)}
.tab:hover b{translate:8px 0}
.tab[aria-selected="true"]{color:var(--ds-cream)}
.tab[aria-selected="true"] i{color:#7FC3D3}
.tab:focus-visible{outline:2px solid var(--ds-cream);outline-offset:3px;border-radius:6px}
.panel{padding-top:22px}
.panel .prose{color:rgba(247,242,232,.74)}
.panel .prose a{color:#9AD3E0}
.panel:not([hidden]) .prose{animation:show .6s cubic-bezier(.2,.7,.2,1)}
@keyframes show{from{opacity:0;translate:0 12px}}

/* контакти */
.con{display:grid;gap:36px}
.con .kicker{padding-bottom:20px;border-bottom:1px solid var(--line)}
.mail{display:block;width:fit-content;max-width:100%;font-weight:500;font-size:clamp(34px,8.2vw,140px);line-height:.95;letter-spacing:-.06em;color:var(--ink);text-decoration:none;margin-left:-.04em;overflow-wrap:anywhere}
.con-f{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:end}
.con-f div{grid-column:1/3;display:grid;gap:6px}
.con-f div b{font-weight:500;font-size:clamp(20px,2vw,28px);line-height:1.2;letter-spacing:-.035em}
.con-f div span{font-weight:600;font-size:14px;letter-spacing:-.01em;color:var(--mute)}
.con-f p{grid-column:3/4;font-weight:600;font-size:18px;letter-spacing:-.02em;color:var(--mute)}
.con-f .lbtn{grid-column:4/5;justify-self:end}

@media (max-width:1000px){
  .pa figure,.pa:nth-child(even) figure{grid-column:1/-1;order:0}
  .pa-t,.pa:nth-child(even) .pa-t{grid-column:1/-1;flex-direction:row;align-items:flex-end}
  .dea-w h2,.dea,.abt-h .kicker,.abt-h h2{grid-column:1/-1}.abt-h .kicker{padding-top:0}
  .cols,.tabs{grid-template-columns:minmax(0,1fr)}
  .con-f div{grid-column:1/-1}.con-f p{grid-column:1/3}.con-f .lbtn{grid-column:3/5}
}
@media (max-width:720px){
  .cover{padding-bottom:88px}   /* місце під тимчасовий перемикач варіантів; після вибору — повернути 28px */
  .cover .wrap{grid-template-columns:minmax(0,1fr);gap:18px}.cover p{justify-self:start;padding-bottom:0}
  .dk{padding-block:64px}.dk .wrap{gap:64px}
  .pas{gap:36px}.pa{gap:8px}
  .pa figure{aspect-ratio:4/5}.pa img{object-position:50% 62%}
  .pa figure,.pa-t,.wide,.mis{border-radius:16px}
  .pa-t{padding:18px}
  .dea{columns:1}
  .lt{gap:72px;padding-block:72px}
  .abt{gap:32px}.cols{gap:28px}
  .wide{aspect-ratio:4/3}
  .tab{padding:18px 0}
  .con-f{grid-template-columns:minmax(0,1fr);gap:20px}.con-f>*{grid-column:1/-1!important}.con-f .lbtn{justify-self:start}
}
@media (prefers-reduced-motion:reduce){.cover>img{animation:none}}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>

<main id="app"></main>

<div class="end">
  <div class="nx-hold" data-dark><site-next></site-next></div>
  <site-footer></site-footer>
</div>

<script src="about/data.js"></script>
<script src="about/base.js"></script>
<script>
(()=>{
const D=window.ABOUT,{esc,photo,name}=AB;
const num=i=>String(i+1).padStart(2,"0");
document.getElementById("app").innerHTML=`
  <section class="cover pad" data-dark>
    <img src="b4/service.webp" alt="Недільне служіння в залі церкви «Філадельфія»" width="2000" height="1333">
    <div class="wrap">
      <h1 class="rv">${esc(D.kicker)}</h1>
      <p class="rv" style="--d:2">${esc(D.title)}</p>
    </div>
  </section>

  <section class="dk pad" data-dark>
    <div class="wrap">
      <div class="pas" aria-label="${esc(D.pastorsTitle)}">${D.pastors.map((p,i)=>`
        <article class="pa rv">
          <figure>${photo(p)}</figure>
          <div class="pa-t"><i>${num(i)}</i><div><p class="kicker">${esc(p.role)}</p><h3>${name(p)}</h3></div></div>
        </article>`).join("")}
      </div>

      <section class="dea-w" aria-labelledby="dea-h">
        <h2 id="dea-h" class="rv">${esc(D.deaconsTitle)}</h2>
        <ul class="dea rv">${D.deacons.map(p=>`
          <li class="de"><span class="de-ph">${photo(p,"a")}</span><b${p.name?"":' class="is-empty"'}>${name(p)}</b></li>`).join("")}
        </ul>
      </section>
    </div>
  </section>

  <div class="lt pad">
    <section class="wrap abt" aria-labelledby="abt-h">
      <div class="abt-h"><p class="kicker rv">${esc(D.aboutTitle)}</p><h2 id="abt-h" class="rv">${esc(D.title)}</h2></div>
      <div class="cols">${D.intro.map((t,i)=>`
        <div class="col rv" style="--d:${i}"><b>${esc(["«Еклезія»",D.facts[0].big,D.facts[1].big][i])}</b><div class="prose"><p>${t}</p></div></div>`).join("")}
      </div>
    </section>

    <figure class="wrap wide rv"><img src="about/church.webp" alt="Церква «Філадельфія»: спільне фото біля будівлі церкви" width="2200" height="1467" loading="lazy"></figure>

    <section class="wrap mis rv" data-dark aria-labelledby="mis-h">
      <div class="mis-h"><p class="kicker">${esc(D.missionKicker)}</p><h2 id="mis-h">${esc(D.mission)}</h2></div>
      <div class="tabs">
        <div class="tablist" role="tablist" aria-label="${esc(D.missionKicker)}">${D.pillars.map((p,i)=>`
          <button class="tab" role="tab" id="tab-${i}" aria-controls="panel-${i}" aria-selected="${!i}" tabindex="${i?-1:0}"><i>${num(i)}</i><b>${esc(p.title)}</b></button>`).join("")}
        </div>
        <div>${D.pillars.map((p,i)=>`
          <div class="panel" role="tabpanel" id="panel-${i}" aria-labelledby="tab-${i}"${i?" hidden":""}><div class="prose">${p.text.map(t=>`<p>${t}</p>`).join("")}</div></div>`).join("")}
        </div>
      </div>
    </section>

    <section class="wrap con" aria-labelledby="con-h">
      <p class="kicker rv" id="con-h">${esc(D.contactsTitle)}</p>
      <a class="mail rv" href="mailto:${esc(D.contacts.email)}" data-no-u>${esc(D.contacts.email)}</a>
      <div class="con-f rv">
        <div><b>${esc(D.contacts.address)}</b><span>${esc(D.contacts.metro)}</span></div>
        <p>${esc(D.contacts.welcome)}</p>
        <a class="lbtn" href="${esc(D.contacts.button.href)}">${esc(D.contacts.button.label)}</a>
      </div>
    </section>
  </div>`;
AB.init();

// перемикач напрямків місії (клік, стрілки вгору/вниз)
const tabs=[...document.querySelectorAll(".tab")], panels=[...document.querySelectorAll(".panel")];
const pick=(n,focus)=>{tabs.forEach((t,i)=>{t.setAttribute("aria-selected",i===n);t.tabIndex=i===n?0:-1;panels[i].hidden=i!==n});if(focus)tabs[n].focus()};
tabs.forEach((t,i)=>{
  t.addEventListener("click",()=>pick(i));
  t.addEventListener("keydown",e=>{
    const d={ArrowDown:1,ArrowRight:1,ArrowUp:-1,ArrowLeft:-1}[e.key];
    if(d){e.preventDefault();pick((i+d+tabs.length)%tabs.length,true)}
  });
});
})();
</script>
</body>
</html>
