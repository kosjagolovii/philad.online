<style>
/* ОСНОВНА · B за основою; заголовок із пасторами та диякони — з варіанта A */
.pg{display:grid;justify-items:center;gap:120px;padding-block:150px 120px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{width:var(--row);max-width:100%;min-width:0;box-sizing:border-box}
h2{font:var(--h2-weight) var(--h2-size)/var(--h2-lh) var(--font);letter-spacing:var(--h2-track);text-wrap:balance}

/* --- з A: заголовок, пастори, диякони --- */
.top{display:grid;justify-items:center;gap:24px;text-align:center}
.top h1{max-width:900px;font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track);text-wrap:balance}
.sec{display:grid;gap:40px}
.pas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* пастори — P2: горизонтальні картки, фото ліворуч, ім'я праворуч */
.pa{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:14px;padding:12px;border-radius:24px;background:var(--card)}
.pa figure{aspect-ratio:6/7;border-radius:14px;overflow:hidden;background:var(--sand)}
.pa img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:scale 1.1s cubic-bezier(.2,.7,.2,1)}
.pa:hover img{scale:1.04}
.pa-t{display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:14px 10px 10px}
.pa-t h3{font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track)}
/* диякони — D1: квадратні картки, фото зверху; ім'я, сан і зона відповідальності */
.dea{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.de{display:grid;grid-template-rows:auto 1fr;gap:14px;padding:10px 10px 20px;border-radius:20px;background:var(--card);min-width:0}
.de-ph{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sand)}
.de-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transition:scale 1.1s cubic-bezier(.2,.7,.2,1)}
.de:hover .de-ph img{scale:1.04}
.de-t{display:grid;align-content:start;gap:6px;padding:0 8px}
.de-t .kicker{font-size:var(--t3-size)}
.de-t b{font:var(--t1-weight) var(--t1-size)/var(--t1-lh) var(--font);letter-spacing:var(--t1-track)}
.de-t span{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}

/* --- з B: про церкву, місія, контакти --- */
.say{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 14px}
.say .kicker{grid-column:1/2;padding-top:.9em}
.say-big{grid-column:2/5;font:var(--h2-weight) var(--h2-size)/var(--h2-lh) var(--font);letter-spacing:var(--h2-track);text-wrap:pretty}
.say-big span{color:rgba(20,20,20,.42)}
.say-cols{grid-column:2/5;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px}
.wide{aspect-ratio:21/9;border-radius:20px;overflow:hidden;background:var(--sand)}
.wide img{width:100%;height:100%;object-fit:cover;object-position:50% 64%}

.mis{display:grid;gap:56px}
.mis-h{display:grid;justify-items:center;gap:22px;text-align:center}
.mis-h h2{max-width:1000px;font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.cd{display:flex;flex-direction:column;gap:28px;padding:28px 24px 30px;border-radius:20px;background:var(--card);min-width:0}
.cd-n{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--ds-cream);font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track)}
.cd h3{font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track);text-wrap:balance;min-height:2.08em}
.cd .prose{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:rgba(20,20,20,.58)}

.con{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.con-a{display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding:clamp(28px,3.4vw,48px);border-radius:20px;background:var(--teal);color:var(--ds-cream);min-height:340px}
.con-a .kicker{color:rgba(247,242,232,.7)}
.con-a h2{font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track)}
.con-b{display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:clamp(28px,3.4vw,48px);border-radius:20px;background:var(--card)}
.con dl{margin:0;display:grid;gap:22px}
.con dt{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute);margin-bottom:4px}
.con dd{margin:0;font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track)}
.con dd small{display:block;margin-top:6px;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}
.con dd a{color:inherit;text-decoration:none}
.con .lbtn{align-self:flex-start}

@media (max-width:1000px){
  .dea{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pas{grid-template-columns:minmax(0,1fr)}
  .say .kicker,.say-big,.say-cols{grid-column:1/-1}.say .kicker{padding-top:0}
  .cards{grid-template-columns:minmax(0,1fr)}.cd h3{min-height:0}
}
@media (max-width:720px){
  .pg{gap:64px;padding-block:120px 64px}
  .sec{gap:24px}
  .pas{grid-template-columns:minmax(0,1fr);gap:24px}
  .wide,.cd,.con-a,.con-b,.pa,.de{border-radius:16px}
  .pa{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px}
  .pa-t{padding:8px 4px 4px}.pa-t h3{font-size:var(--h3-size)}
  .dea{gap:8px}.de{padding:8px 8px 16px}.de-t{padding:0 4px}.de-t b{font-size:var(--t1-size)}.de-t span{font-size:var(--t2-size)}
  .say{gap:16px}.say-cols{grid-template-columns:minmax(0,1fr)}
  .wide{aspect-ratio:4/3}
  .mis{gap:24px}
  .con{grid-template-columns:minmax(0,1fr)}.con-a{min-height:220px}
}
.con-l{display:flex;flex-wrap:wrap;gap:0 20px;margin:20px 0 0}
@media (max-width:900px),(pointer:coarse){.con-l a{display:inline-flex;align-items:center;min-height:40px}}   /* зона натискання на телефоні */
.con-l a{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* мобільна шкала відступів (snap-spacing.py): база → 8·16·24·40·64 */
@media (max-width:720px){
  .pa-t{gap:16px}
  .de{gap:16px}
  .say-cols{gap:16px 40px}
  .mis-h{gap:24px}
  .cards{gap:16px}
  .cd{gap:24px;padding:24px 24px 24px}
  .con{gap:16px}
  .con-b{gap:24px}
  .con dl{gap:24px}
  .con-l{gap:0 16px;margin:16px 0 0}
}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>

<main class="pg" id="app"></main>

<div class="end">
  <site-footer></site-footer>
</div>

<script src="about/data.js"></script>
<script src="about/base.js"></script>
<script>
(()=>{
const D=window.ABOUT,{esc,photo,name}=AB;
const first=D.intro[0], cut=first.indexOf(". ",first.indexOf(". ")+1)+1;
document.getElementById("app").innerHTML=`
  <header class="top">
    <p class="kicker rv">${esc(D.kicker)}</p>
    <h1 class="rv" style="--d:1">${esc(D.title)}</h1>
  </header>

  <section class="sec" aria-labelledby="pas-h">
    <h2 id="pas-h" class="rv">${esc(D.pastorsTitle)}</h2>
    <div class="pas">${D.pastors.map((p,i)=>`
      <article class="pa rv" style="--d:${i}">
        <figure>${photo(p,"p")}</figure>
        <div class="pa-t"><p class="kicker">${esc(p.role)}</p><h3>${name(p)}</h3></div>
      </article>`).join("")}
    </div>
  </section>

  <section class="sec" aria-labelledby="dea-h">
    <h2 id="dea-h" class="rv">${esc(D.deaconsTitle)}</h2>
    <ul class="dea">${D.deacons.map((p,i)=>`
      <li class="de rv" style="--d:${i%4}"><span class="de-ph">${photo(p,"d")}</span><div class="de-t"><p class="kicker">${esc(p.rank||"Диякон")}</p><b>${name(p)}</b>${p.duty?`<span>${esc(p.duty)}</span>`:""}</div></li>`).join("")}
    </ul>
  </section>

  <section class="say" aria-label="${esc(D.aboutTitle)}">
    <p class="kicker rv">${esc(D.aboutTitle)}</p>
    <p class="say-big rv">${first.slice(0,cut)}<span>${first.slice(cut)}</span></p>
    <div class="say-cols">${D.intro.slice(1).map((t,i)=>`<div class="prose rv" style="--d:${i}"><p>${t}</p></div>`).join("")}</div>
  </section>

  <figure class="wide rv"><img src="about/church.webp" alt="Церква «Філадельфія»: спільне фото біля будівлі церкви" width="2200" height="1467" loading="lazy"></figure>

  <section class="mis" aria-labelledby="mis-h">
    <div class="mis-h"><p class="kicker rv">${esc(D.missionKicker)}</p><h2 id="mis-h" class="rv" style="--d:1">${esc(D.mission)}</h2></div>
    <div class="cards">${D.pillars.map((p,i)=>`
      <article class="cd rv" style="--d:${i}">
        <span class="cd-n">${i+1}</span>
        <h3>${esc(p.title)}</h3>
        <div class="prose">${p.text.map(t=>`<p>${t}</p>`).join("")}</div>
      </article>`).join("")}
    </div>
  </section>

  <section class="con" aria-labelledby="con-h">
    <div class="con-a rv"><p class="kicker" id="con-h">${esc(D.contactsTitle)}</p><h2>${esc(D.contacts.welcome)}</h2></div>
    <div class="con-b rv" style="--d:1">
      <dl>
        <div><dt>Email</dt><dd><a href="mailto:${esc(D.contacts.email)}">${esc(D.contacts.email)}</a></dd></div>
        <div><dt>Адреса</dt><dd>${esc(D.contacts.address)}<small>${esc(D.contacts.metro)}</small></dd></div>
      </dl>
      <a class="lbtn" href="${esc(D.contacts.button.href)}">${esc(D.contacts.button.label)}</a>
      <p class="con-l">${(D.contacts.links||[]).map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join("")}</p>
    </div>
  </section>`;
AB.init();
})();
</script>
</body>
</html>
