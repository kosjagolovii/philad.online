<style>
/* ОСНОВНА · B за основою; заголовок із пасторами та диякони — з варіанта A */
.pg{display:grid;justify-items:center;gap:120px;padding-block:150px 120px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>*{width:var(--row);max-width:100%;min-width:0;box-sizing:border-box}
h2{font:var(--h2-weight) var(--h2-size)/var(--h2-lh) var(--font);letter-spacing:var(--h2-track);text-wrap:balance}

/* --- з A: заголовок, пастори, диякони --- */
.top{display:grid;justify-items:center;gap:24px;text-align:center}
.top h1{max-width:900px;font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track);text-wrap:balance}
.sec{display:grid;gap:40px}
.pas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
/* пастори — P2: горизонтальні картки, фото ліворуч, ім'я праворуч */
.pa{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:14px;padding:12px;border-radius:24px;background:var(--card)}
.pa figure{aspect-ratio:6/7;border-radius:14px;overflow:hidden;background:var(--sand)}
.pa img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:scale 1.1s cubic-bezier(.2,.7,.2,1)}
.pa:hover img{scale:1.04}
.pa-t{display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:14px 10px 10px}
.pa-t h3{font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track)}
/* диякони — D1: квадратні картки, фото зверху; ім'я, сан і зона відповідальності */
.dea{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.de{display:grid;grid-template-rows:auto 1fr;gap:14px;padding:10px 10px 20px;border-radius:20px;background:var(--card);min-width:0}
.de-ph{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--sand)}
.de-ph img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transition:scale 1.1s cubic-bezier(.2,.7,.2,1)}
.de:hover .de-ph img{scale:1.04}
.de-t{display:grid;align-content:start;gap:6px;padding:0 8px}
.de-t .kicker{font-size:var(--t3-size)}
.de-t b{font:var(--t1-weight) var(--t1-size)/var(--t1-lh) var(--font);letter-spacing:var(--t1-track)}
.de-t span{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}

/* --- з B: про церкву, місія, контакти --- */
.say{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 14px}
.say .kicker{grid-column:1/2;padding-top:.9em}
.say-big{grid-column:2/5;font:var(--h2-weight) var(--h2-size)/var(--h2-lh) var(--font);letter-spacing:var(--h2-track);text-wrap:pretty}
.say-big span{color:rgba(20,20,20,.42)}
.say-big .hint{position:relative;color:inherit;outline:none}
.say-big .hint-t{position:absolute;left:50%;bottom:calc(100% + 10px);z-index:5;width:max-content;max-width:min(260px,70vw);padding:9px 14px;border-radius:12px;background:#fff;color:var(--night,#14110F);box-shadow:0 10px 28px rgba(20,17,15,.16),0 2px 6px rgba(20,17,15,.08);font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);text-decoration:none;text-wrap:balance;opacity:0;visibility:hidden;transform:translate(calc(-50% + var(--dx,0px)),6px);transition:opacity .2s ease,transform .25s cubic-bezier(.2,.7,.2,1),visibility .2s;pointer-events:none}
.say-big .hint-t::after{content:"";position:absolute;left:calc(50% - var(--dx,0px));top:100%;width:10px;height:10px;background:#fff;box-shadow:3px 3px 6px rgba(20,17,15,.07);transform:translate(-50%,-5px) rotate(45deg);border-radius:2px}
.say-big .hint:hover .hint-t,.say-big .hint:focus-visible .hint-t,.say-big .hint:focus .hint-t{opacity:1;visibility:visible;transform:translate(calc(-50% + var(--dx,0px)),0)}
@media (prefers-reduced-motion:reduce){.say-big .hint-t{transition:none}}
.say-cols{grid-column:2/5;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px}
.wide{aspect-ratio:21/9;border-radius:20px;overflow:hidden;background:var(--sand)}
.wide img{width:100%;height:100%;object-fit:cover;object-position:50% 64%}

.mis{display:grid;gap:56px}
.mis-h{display:grid;justify-items:center;gap:22px;text-align:center}
.mis-h h2{max-width:1000px;font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:stretch}
.cd{display:flex;flex-direction:column;gap:28px;padding:28px 24px 30px;border-radius:20px;background:var(--card);min-width:0}
.cd-n{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--teal);color:var(--ds-cream);font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track)}
.cd h3{font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track);text-wrap:balance;min-height:2.08em}
.cd .prose{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:rgba(20,20,20,.58)}

.con{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.con-a{display:flex;flex-direction:column;justify-content:space-between;gap:40px;padding:clamp(28px,3.4vw,48px);border-radius:20px;background:var(--teal);color:var(--ds-cream);min-height:340px}
.con-a .kicker{color:rgba(247,242,232,.7)}
.con-a h2{font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track)}
.con-b{display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:clamp(28px,3.4vw,48px);border-radius:20px;background:var(--card)}
.con dl{margin:0;display:grid;gap:22px}
.con dt{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute);margin-bottom:4px}
.con dd{margin:0;font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track)}
.con dd small{display:block;margin-top:6px;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}
.con dd a{color:inherit;text-decoration:none}
.con .lbtn{align-self:flex-start}

@media (max-width:1000px){
  .dea{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pas{grid-template-columns:minmax(0,1fr)}
  .say .kicker,.say-big,.say-cols{grid-column:1/-1}.say .kicker{padding-top:0}
  .cards{grid-template-columns:minmax(0,1fr)}.cd h3{min-height:0}
}
@media (max-width:720px){
  .pg{gap:64px;padding-block:120px 64px}
  .sec{gap:24px}
  .pas{grid-template-columns:minmax(0,1fr);gap:24px}
  .wide,.cd,.con-a,.con-b,.pa,.de{border-radius:16px}
  .pa{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px}
  .pa-t{padding:8px 4px 4px}.pa-t h3{font-size:var(--h3-size)}
  .dea{gap:8px}.de{padding:8px 8px 16px}.de-t{padding:0 4px}.de-t b{font-size:var(--t1-size)}.de-t span{font-size:var(--t2-size)}
  .say{gap:16px}.say-cols{grid-template-columns:minmax(0,1fr)}
  .wide{aspect-ratio:4/3}
  .mis{gap:24px}
  .con{grid-template-columns:minmax(0,1fr)}.con-a{min-height:220px}
}
.con-l{display:flex;flex-wrap:wrap;gap:0 20px;margin:20px 0 0}
@media (max-width:900px),(pointer:coarse){.con-l a{display:inline-flex;align-items:center;min-height:40px}}   /* зона натискання на телефоні */
.con-l a{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

/* мобільна шкала відступів (snap-spacing.py): база → 8·16·24·40·64 */
@media (max-width:720px){
  .pa-t{gap:16px}
  .de{gap:16px}
  .say-cols{gap:16px 40px}
  .mis-h{gap:24px}
  .cards{gap:16px}
  .cd{gap:24px;padding:24px 24px 24px}
  .con{gap:16px}
  .con-b{gap:24px}
  .con dl{gap:24px}
  .con-l{gap:0 16px;margin:16px 0 0}
}

/* планшетна шкала відступів (snap-tablet.py): база → 8·16·24·32·48·80 */
@media (min-width:721px) and (max-width:1000px){
  .sec{gap:32px}
  .pas{gap:16px}
  .pa{gap:16px;padding:8px}
  .pa-t{gap:16px;padding:16px 8px 8px}
  .dea{gap:16px}
  .de{gap:16px;padding:8px 8px 16px}
  .say{gap:32px 16px}
  .say-cols{gap:16px 32px}
  .mis{gap:48px}
  .mis-h{gap:24px}
  .cards{gap:16px}
  .cd{gap:24px;padding:24px 24px 32px}
  .con{gap:16px}
  .con-a{gap:32px}
  .con dl{gap:24px}
  .con-l{gap:0 16px;margin:16px 0 0}
}
@media (min-width:1001px) and (max-width:1180px),(min-width:1181px) and (max-width:1366px) and (pointer:coarse){
  .sec{gap:32px}
  .pas{gap:16px}
  .pa{gap:16px;padding:8px}
  .pa-t{gap:16px;padding:16px 8px 8px}
  .dea{gap:16px}
  .de{gap:16px;padding:8px 8px 16px}
  .say{gap:32px 16px}
  .say-cols{gap:16px 32px}
  .mis{gap:48px}
  .mis-h{gap:24px}
  .cards{gap:16px}
  .cd{gap:24px;padding:24px 24px 32px}
  .con{gap:16px}
  .con-a{gap:32px}
  .con dl{gap:24px}
  .con-l{gap:0 16px;margin:16px 0 0}
}

/* --- УЦХВЄ: належність до братерства --- */
.uc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 14px}
.uc .kicker{grid-column:1/2;padding-top:.9em}
.uc-card{grid-column:2/5;display:grid;gap:40px;padding:clamp(28px,3.4vw,48px);border-radius:20px;background:var(--card)}
.uc-logo{display:block;width:auto;height:56px}
.uc-card h2{max-width:900px;font:var(--h2s-weight) var(--h2s-size)/var(--h2s-lh) var(--font);letter-spacing:var(--h2s-track);text-wrap:balance}
.uc-lead{margin:0;max-width:760px;font:var(--t1-weight) var(--t1-size)/var(--t1-lh) var(--font);letter-spacing:var(--t1-track);color:var(--soft);text-wrap:pretty}
.uc-st{margin:0;padding:24px 0 0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 32px;border-top:1px solid var(--line)}
.uc-st b{display:block;font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track);color:var(--teal)}
.uc-st span{display:block;margin-top:8px;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--mute)}
.uc-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 40px}
.uc-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px}
.uc-foot a{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);letter-spacing:var(--t2-track);color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.uc-foot small{font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);color:var(--mute)}
@media (max-width:900px),(pointer:coarse){.uc-foot a{display:inline-flex;align-items:center;min-height:40px}}
@media (max-width:1000px){.uc .kicker,.uc-card{grid-column:1/-1}.uc .kicker{padding-top:0}}
@media (max-width:720px){
  .uc{gap:16px}.uc-card{gap:24px;border-radius:16px}
  .uc-logo{height:44px}
  .uc-st{grid-template-columns:minmax(0,1fr);gap:16px}
  .uc-st li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);align-items:center;gap:16px}
  .uc-st b{font-size:var(--h2s-size);min-width:5.2em}.uc-st span{margin-top:0}
  .uc-cols{grid-template-columns:minmax(0,1fr);gap:16px}
}

/* --- v2: гасло, бачення, пункти місії, цінності --- */
.slo{position:relative;isolation:isolate;overflow:hidden;border-radius:20px;min-height:clamp(480px,48vw,720px);display:flex;align-items:flex-end;padding:clamp(24px,3.4vw,48px);color:var(--ds-cream);background:var(--night,#14110F)}
.slo>img{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:50% 55%}
.slo::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(to top,rgba(20,17,15,.72),rgba(20,17,15,.38) 55%,rgba(20,17,15,.28))}
.slo-a{display:grid;gap:20px;max-width:880px}
.slo h2{font:var(--d1-weight) var(--d1-size)/var(--d1-lh) var(--font);letter-spacing:var(--d1-track);text-wrap:balance}
.slo-b{display:grid;gap:8px;max-width:620px}
.slo-v{margin:0;font:var(--t1-weight) var(--t1-size)/var(--t1-lh) var(--font);letter-spacing:var(--t1-track);color:rgba(247,242,232,.92);text-wrap:pretty}
.slo-r{margin:0;font:var(--t2-weight) var(--t2-size)/var(--t2-lh) var(--font);color:rgba(247,242,232,.72)}
/* таби: бачення · місія · цінності */
.tb{display:grid;justify-items:center;gap:48px}
.tb-bar{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--card)}

.tb-bar button:hover{background:rgba(20,20,20,.06)}
.tb-bar button[aria-selected="true"]{background:var(--teal);color:var(--ds-cream)}
.tb-bar button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

.tb-body [role="tabpanel"][hidden]{display:none}
.vis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 14px}
.vis .kicker{grid-column:1/2;padding-top:.9em}

.mis-h h2.mis-t{max-width:1100px;font:var(--h2-weight) var(--h2-size)/var(--h2-lh) var(--font);letter-spacing:var(--h2-track)}
.mis .cd h3,.val .cd h3{min-height:0}

.mis-more a{color:var(--teal-ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

@media (max-width:1000px){
  .vis .kicker,.vis-big{grid-column:1/-1}.vis .kicker{padding-top:0}

@media (max-width:720px){
  .slo{border-radius:16px;min-height:480px}.slo-a{gap:16px}

<site-menu tone="auto"></site-menu>

<main class="pg" id="app"></main>

<site-footer></site-footer>

<script src="about/data.js"></script>
<script src="about/base.js"></script>
<script>
(()=>{
const D=window.ABOUT,{esc,photo,name}=AB;
const first=D.intro[0], cut=first.indexOf(". ",first.indexOf(". ")+1)+1;
document.getElementById("app").innerHTML=`
  <header class="top">
    <p class="kicker rv">${esc(D.kicker)}</p>
    <h1 class="rv" style="--d:1">${esc(D.title)}</h1>
  </header>

  <section class="sec" aria-labelledby="pas-h">
    <h2 id="pas-h" class="rv">${esc(D.pastorsTitle)}</h2>
    <div class="pas">${D.pastors.map((p,i)=>`
      <article class="pa rv" style="--d:${i}">
        <figure>${photo(p,"p")}</figure>
        <div class="pa-t"><p class="kicker">${esc(p.role)}</p><h3>${name(p)}</h3></div>
      </article>`).join("")}
    </div>
  </section>

  <section class="sec" aria-labelledby="dea-h">
    <h2 id="dea-h" class="rv">${esc(D.deaconsTitle)}</h2>
    <ul class="dea">${D.deacons.map((p,i)=>`
      <li class="de rv" style="--d:${i%4}"><span class="de-ph">${photo(p,"d")}</span><div class="de-t"><p class="kicker">${esc(p.rank||"Диякон")}</p><b>${name(p)}</b>${p.duty?`<span>${esc(p.duty)}</span>`:""}</div></li>`).join("")}
    </ul>
  </section>

  <section class="say" aria-label="${esc(D.aboutTitle)}">
    <p class="kicker rv">${esc(D.aboutTitle)}</p>
    <p class="say-big rv">${first.slice(0,cut)}<span>${first.slice(cut).replace("«еклезія»",'<span class="hint" tabindex="0">«еклезія»<span class="hint-t" role="tooltip">Це не те що ви подумали</span></span>')}</span></p>
    <div class="say-cols">${D.intro.slice(1).map((t,i)=>`<div class="prose rv" style="--d:${i}"><p>${t}</p></div>`).join("")}</div>
  </section>

  <section class="uc" aria-labelledby="uc-h">
    <p class="kicker rv">${esc(D.union.kicker)}</p>
    <div class="uc-card rv" style="--d:1">
      <img class="uc-logo" src="${esc(D.union.logo)}" alt="${esc(D.union.logoAlt)}" width="593" height="196" loading="lazy">
      <h2 id="uc-h">${esc(D.union.title)}</h2>
      <p class="uc-lead">${esc(D.union.lead)}</p>
      <ul class="uc-st">${D.union.stats.map(x=>`<li><b>${esc(x.big)}</b><span>${esc(x.text)}</span></li>`).join("")}</ul>
      <div class="uc-cols prose">${D.union.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
      <div class="uc-foot"><a href="${esc(D.union.link.href)}" target="_blank" rel="noopener">${esc(D.union.link.label)}</a><small>${esc(D.union.note)}</small></div>
    </div>
  </section>

  <figure class="wide rv"><img src="about/church.webp" alt="Церква «Філадельфія»: спільне фото біля будівлі церкви" width="2200" height="1467" loading="lazy"></figure>

  <section class="tb" aria-label="Бачення, місія, цінності">
    <div class="tb-bar rv" role="tablist" aria-label="Бачення, місія, цінності">
      ${[["vision","Бачення"],["mission","Місія"],["values","Цінності"]].map(([k,l],n)=>`<button type="button" role="tab" id="tb-t-${k}" aria-controls="tb-p-${k}" aria-selected="${n==0}" tabindex="${n==0?0:-1}">${l}</button>`).join("")}
    </div>
    <div class="tb-body rv" style="--d:1">
      <div class="mis" role="tabpanel" id="tb-p-vision" aria-labelledby="tb-t-vision">
        <div class="mis-h"><h2 class="mis-t">${esc(D.vision)}</h2></div>
      </div>
      <div class="mis" role="tabpanel" id="tb-p-mission" aria-labelledby="tb-t-mission" hidden>
        <div class="mis-h"><h2 class="mis-t">${esc(D.mission)}</h2></div>
        <div class="cards">${D.pillars.map((p,i)=>`
          <article class="cd">
            <span class="cd-n">${i+1}</span>
            <h3>${esc(p.title)}</h3>
            <div class="prose">${p.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
          </article>`).join("")}
        </div>
        <p class="mis-more">${D.missionMore}</p>
      </div>
      <div class="val" role="tabpanel" id="tb-p-values" aria-labelledby="tb-t-values" hidden>
        <div class="cards">${D.values.map(v=>`
          <article class="cd">
            <h3>${esc(v.title)}</h3>
            <div class="prose"><p>${esc(v.text)}</p></div>
          </article>`).join("")}
        </div>
      </div>
    </div>
  </section>

  <section class="slo rv" aria-label="${esc(D.slogan.text)}">
    <img src="about/slogan.webp" alt="Богослужіння в церкві «Філадельфія»: зал, сцена та люди, що моляться" width="2400" height="1600" loading="lazy">
    <div class="slo-a">
      <h2>${esc(D.slogan.text)}</h2>
      <div class="slo-b"><p class="slo-v">${esc(D.slogan.verse)}</p><p class="slo-r">${esc(D.slogan.ref)}</p></div>
    </div>
  </section>

  <section class="con" aria-labelledby="con-h">
    <div class="con-a rv"><p class="kicker" id="con-h">${esc(D.contactsTitle)}</p><h2>${esc(D.contacts.welcome)}</h2></div>
    <div class="con-b rv" style="--d:1">
      <dl>
        <div><dt>Email</dt><dd><a href="mailto:${esc(D.contacts.email)}">${esc(D.contacts.email)}</a></dd></div>
        <div><dt>Адреса</dt><dd>${esc(D.contacts.address)}<small>${esc(D.contacts.metro)}</small></dd></div>
      </dl>
      <a class="lbtn" href="${esc(D.contacts.button.href)}">${esc(D.contacts.button.label)}</a>
      <p class="con-l">${(D.contacts.links||[]).map(l=>`<a href="${esc(l.href)}">${esc(l.label)}</a>`).join("")}</p>
    </div>
  </section>`;
document.querySelectorAll(".tb").forEach(tb=>{
  const tabs=[...tb.querySelectorAll('[role="tab"]')];
  const show=t=>{tabs.forEach(b=>{const on=b===t;b.setAttribute("aria-selected",on);b.tabIndex=on?0:-1;document.getElementById(b.getAttribute("aria-controls")).hidden=!on})};
  tabs.forEach((b,i)=>{
    b.addEventListener("click",()=>show(b));
    b.addEventListener("keydown",e=>{
      const d={ArrowRight:1,ArrowLeft:-1}[e.key]; if(!d&&e.key!=="Home"&&e.key!=="End")return;
      e.preventDefault(); const n=e.key==="Home"?0:e.key==="End"?tabs.length-1:(i+d+tabs.length)%tabs.length; tabs[n].focus(); show(tabs[n]);
    });
  });
});
document.querySelectorAll(".hint").forEach(h=>{
  const t=h.querySelector(".hint-t");
  const place=()=>{t.style.setProperty("--dx","0px");const r=t.getBoundingClientRect(),m=8;let d=0;
    if(r.left<m)d=m-r.left;else if(r.right>innerWidth-m)d=innerWidth-m-r.right;
    t.style.setProperty("--dx",d+"px")};
  ["mouseenter","focus","touchstart"].forEach(e=>h.addEventListener(e,place,{passive:true}));
});
AB.init();
})();
</script>
</body>
</html>
