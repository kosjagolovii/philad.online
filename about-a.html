<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Про нас</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<link rel="stylesheet" href="about/base.css">
<style>
/* ВАРІАНТ A · «Журнал» — світла редакційна сторінка на сітці сайту (4 колонки) */
.ab{display:grid;justify-items:center;gap:120px;padding-block:150px 120px;
  padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.ab>*{width:var(--row);max-width:100%;min-width:0;box-sizing:border-box}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:14px}
h2{font-weight:500;font-size:clamp(30px,3.5vw,50px);line-height:1.12;letter-spacing:-.04em;text-wrap:balance}

/* заголовок */
.top{display:grid;justify-items:center;gap:24px;text-align:center}
.top h1{max-width:900px;font-weight:500;font-size:clamp(38px,4.9vw,70px);line-height:1.1;letter-spacing:-.045em;text-wrap:balance}

/* пастори */
.sec{display:grid;gap:40px}
.pas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pa figure{aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:var(--sand)}
.pa img{width:100%;height:100%;object-fit:cover;object-position:50% 56%;transition:scale 1.1s cubic-bezier(.2,.7,.2,1)}
.pa:hover img{scale:1.04}
.pa-t{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:20px 4px 0}
.pa-t h3{font-weight:500;font-size:clamp(26px,2.8vw,40px);line-height:1.1;letter-spacing:-.04em}

/* диякони */
.dea{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.de{display:flex;align-items:center;gap:16px;padding:14px;border-radius:16px;background:var(--card);min-width:0}
.de-ph{flex:none;width:72px;height:72px;border-radius:50%;overflow:hidden}
.de-ph>*{width:100%;height:100%;object-fit:cover}
.de b{font-weight:600;font-size:18px;line-height:1.25;letter-spacing:-.02em}

/* про церкву */
.wide{aspect-ratio:2/1;border-radius:20px;overflow:hidden;background:var(--sand)}
.wide img{width:100%;height:100%;object-fit:cover;object-position:50% 62%}
.about{row-gap:24px}
.about h2{grid-column:1/3}
.about .prose{grid-column:3/5}
.about .prose p:first-child{font-size:clamp(20px,1.9vw,26px);line-height:1.35;letter-spacing:-.03em;color:var(--ink)}

/* місія */
.mis{display:grid;justify-items:center;gap:24px;padding:clamp(48px,7vw,110px) clamp(24px,6vw,90px);border-radius:20px;background:var(--ink);color:var(--ds-cream);text-align:center}
.mis .kicker{color:rgba(247,242,232,.6)}
.mis p:last-child{max-width:980px;font-weight:500;font-size:clamp(28px,3.6vw,54px);line-height:1.14;letter-spacing:-.045em;text-wrap:balance}
.pil{margin-top:-64px}
.pi{padding-block:36px;border-top:1px solid var(--line);row-gap:16px;align-items:start}
.pi:last-child{border-bottom:1px solid var(--line)}
.pi-n{grid-column:1/3;font-weight:600;font-size:14px;letter-spacing:-.02em;color:var(--teal)}
.pi h3{grid-column:1/3;font-weight:500;font-size:clamp(26px,2.8vw,40px);line-height:1.1;letter-spacing:-.04em}
.pi .prose{grid-column:3/5;grid-row:1/4}

/* контакти */
.con{padding:clamp(28px,4vw,56px);border-radius:20px;background:var(--card);row-gap:32px;align-items:end}
.con-h{grid-column:1/3;display:grid;gap:14px;align-self:start}
.con-h p{font-weight:600;font-size:18px;letter-spacing:-.02em;color:var(--mute)}
.con-b{grid-column:3/5;display:grid;gap:28px;justify-items:start}
.con dl{margin:0;display:grid;gap:18px;width:100%}
.con dl div{display:grid;gap:4px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.con dt{font-weight:600;font-size:14px;letter-spacing:-.02em;color:var(--mute)}
.con dd{margin:0;font-weight:500;font-size:clamp(20px,1.9vw,26px);line-height:1.25;letter-spacing:-.03em}
.con dd small{display:block;margin-top:4px;font-weight:600;font-size:14px;letter-spacing:-.01em;color:var(--mute)}
.con a:not(.lbtn){color:inherit;text-decoration:none}

@media (max-width:1000px){
  .dea{grid-template-columns:repeat(2,minmax(0,1fr))}
  .about h2,.about .prose,.pi h3,.pi .prose,.con-h,.con-b{grid-column:1/-1}
  .pi .prose{grid-row:auto}
}
@media (max-width:720px){
  .ab{gap:72px;padding-block:120px 72px}
  .sec{gap:24px}
  .pas{grid-template-columns:minmax(0,1fr);gap:28px}
  .pa figure,.wide,.mis,.con{border-radius:16px}
  .pa-t{padding-top:14px;flex-direction:column-reverse;gap:6px}
  .dea{grid-template-columns:minmax(0,1fr);gap:8px}
  .de{padding:10px}.de-ph{width:56px;height:56px}.de b{font-size:16px}
  .wide{aspect-ratio:4/3}
  .pil{margin-top:-32px}.pi{padding-block:28px}
}
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>

<main class="ab" id="app"></main>

<div class="end">
  <div class="nx-hold" data-dark><site-next></site-next></div>
  <site-footer></site-footer>
</div>

<script src="about/data.js"></script>
<script src="about/base.js"></script>
<script>
(()=>{
const D=window.ABOUT,{esc,photo,name}=AB;
const num=i=>String(i+1).padStart(2,"0");
document.getElementById("app").innerHTML=`
  <header class="top">
    <p class="kicker rv">${esc(D.kicker)}</p>
    <h1 class="rv" style="--d:1">${esc(D.title)}</h1>
  </header>

  <section class="sec" aria-labelledby="pas-h">
    <h2 id="pas-h" class="rv">${esc(D.pastorsTitle)}</h2>
    <div class="pas">${D.pastors.map((p,i)=>`
      <article class="pa rv" style="--d:${i}">
        <figure>${photo(p)}</figure>
        <div class="pa-t"><h3>${name(p)}</h3><p class="kicker">${esc(p.role)}</p></div>
      </article>`).join("")}
    </div>
  </section>

  <section class="sec" aria-labelledby="dea-h">
    <h2 id="dea-h" class="rv">${esc(D.deaconsTitle)}</h2>
    <ul class="dea">${D.deacons.map((p,i)=>`
      <li class="de rv" style="--d:${i%4}"><span class="de-ph">${photo(p,"a")}</span><b${p.name?"":' class="is-empty"'}>${name(p)}</b></li>`).join("")}
    </ul>
  </section>

  <figure class="wide rv"><img src="about/church.webp" alt="Церква «Філадельфія»: спільне фото біля будівлі церкви" width="2200" height="1467" loading="lazy"></figure>

  <section class="g4 about" aria-labelledby="abt-h">
    <h2 id="abt-h" class="rv">${esc(D.aboutTitle)}</h2>
    <div class="prose rv">${D.intro.map(t=>`<p>${t}</p>`).join("")}</div>
  </section>

  <section class="mis rv" data-dark aria-label="${esc(D.missionKicker)}">
    <p class="kicker">${esc(D.missionKicker)}</p>
    <p>${esc(D.mission)}</p>
  </section>

  <div class="pil">${D.pillars.map((p,i)=>`
    <article class="g4 pi rv">
      <span class="pi-n">${num(i)}</span>
      <h3>${esc(p.title)}</h3>
      <div class="prose">${p.text.map(t=>`<p>${t}</p>`).join("")}</div>
    </article>`).join("")}
  </div>

  <section class="g4 con rv" aria-labelledby="con-h">
    <div class="con-h"><h2 id="con-h">${esc(D.contactsTitle)}</h2><p>${esc(D.contacts.welcome)}</p></div>
    <div class="con-b">
      <dl>
        <div><dt>Email</dt><dd><a href="mailto:${esc(D.contacts.email)}">${esc(D.contacts.email)}</a></dd></div>
        <div><dt>Адреса</dt><dd>${esc(D.contacts.address)}<small>${esc(D.contacts.metro)}</small></dd></div>
      </dl>
      <a class="lbtn" href="${esc(D.contacts.button.href)}">${esc(D.contacts.button.label)}</a>
    </div>
  </section>`;
AB.init();
})();
</script>
</body>
</html>
