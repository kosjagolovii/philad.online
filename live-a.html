<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LIVE трансляція</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="components/site.js"></script>
<script src="components/live-player.js"></script>
<style>
:root{--ds-cream:#F7F2E8;--ink:#141414;--teal:#317C8E;--sans:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--side:12px;color-scheme:light}
html,body{margin:0;padding:0;color:var(--ink)}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
.pg{display:grid;justify-items:center;padding-block:96px 72px;padding-left:max(var(--side),env(safe-area-inset-left,0px));padding-right:max(var(--side),env(safe-area-inset-right,0px))}
.pg>.row-w{min-width:0}
.end{position:relative;z-index:3}
@media (max-width:720px){:root{--side:16px}.pg{padding-block:84px 48px}}
html,body{background:var(--ds-cream)}
/* ВАРІАНТ A · «Кіно» — відео на всю ширину контенту, кнопки поверх відео, підпис під ним */
</style>
</head>
<body>
<site-menu tone="auto"></site-menu>
<main class="pg"><div class="row-w"><live-player variant="a"></live-player></div></main>
<site-footer></site-footer>
<script>document.getElementById("footer")&&document.getElementById("footer").setAttribute("data-dark","")</script>
<script src="live/switcher.js"></script>
</body>
</html>
